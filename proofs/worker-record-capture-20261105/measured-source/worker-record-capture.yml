name: Worker record capture verification

on:
  pull_request:
    paths:
      - 'worker*.ts'
      - 'shared.ts'
      - 'arena.ts'
      - '*.as.ts'
      - 'proofs/worker-record-capture-20261105/**'
      - 'scripts/build-browser.ts'
      - 'scripts/build-wasm.mjs'
      - 'package.json'
      - 'vitest*.ts'
      - '.github/workflows/worker-record-capture.yml'
  push:
    branches: [main]
    paths:
      - 'worker*.ts'
      - 'shared.ts'
      - 'arena.ts'
      - '*.as.ts'
      - 'proofs/worker-record-capture-20261105/**'
      - 'scripts/build-browser.ts'
      - 'scripts/build-wasm.mjs'
      - 'package.json'
      - 'vitest*.ts'
      - '.github/workflows/worker-record-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-record-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies and build portable modules
        run: |
          bun install
          bun run build:wasm
          bun run build:browser
      - name: Run Node and Bun focused regressions
        run: |
          node node_modules/vitest/vitest.mjs run worker-record-capture.test.ts worker.test.ts worker-records.test.ts --maxWorkers=1
          bun --bun node_modules/vitest/vitest.mjs run worker-record-capture.test.ts worker.test.ts worker-records.test.ts --maxWorkers=1
      - name: Verify real Node workers
        run: |
          node proofs/worker-record-capture-20261105/worker.mjs
          node proofs/worker-sessions.mjs
      - name: Verify existing browser session behavior
        run: |
          bunx playwright install --with-deps chromium
          node node_modules/vitest/vitest.mjs run --config vitest.browser.config.ts demo/sessions.browser.test.ts
      - name: Independently verify saved evidence without rerunning timings
        run: python3 proofs/worker-record-capture-20261105/verify.py proofs/worker-record-capture-20261105/*.json.gz
