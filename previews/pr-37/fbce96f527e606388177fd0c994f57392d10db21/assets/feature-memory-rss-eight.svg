<svg xmlns="http://www.w3.org/2000/svg" width="440" height="470" viewBox="0 0 440 470" role="img" aria-labelledby="title desc"><title id="title">Eight readers: separate cohort</title><desc id="desc">Absolute whole-process endpoint RSS for eight-reader cases from a separate cohort on AMD EPYC 7763 64-Core Processor. 100,000 synthetic records, 100 replacements, initial and current retained. Median of three fresh Node processes. Startup baseline is not subtracted. Zero-reader controls are excluded. This is not peak RSS or browser RAM.</desc><rect width="440" height="470" fill="#f7f8f2"/><g font-family="system-ui,sans-serif" fill="#17251e"><text x="20" y="32" font-size="21" font-weight="650">Eight readers: separate cohort</text><text x="20" y="60" font-size="13">Absolute endpoint RSS · retained revision 0 + 1</text><text x="20" y="82" font-size="12">2026-10-11 · Node v22.23.3 · source f140ebe</text><text x="20" y="118" font-size="15" font-weight="600">8 reader workers</text><text x="20" y="148" font-size="15">SharedMap</text><text x="420" y="148" text-anchor="end" font-size="15">281.18 MiB</text><rect x="20" y="158" width="400" height="12" fill="#e2e8d8"/><rect x="20" y="158" width="106.10554245283019" height="12" fill="#52731a"/><text x="20" y="198" font-size="15">Native Map</text><text x="420" y="198" text-anchor="end" font-size="15">961.34 MiB</text><rect x="20" y="208" width="400" height="12" fill="#e2e8d8"/><rect x="20" y="208" width="362.7682783018868" height="12" fill="#766294"/><text x="20" y="248" font-size="15">Immutable.js Map</text><text x="420" y="248" text-anchor="end" font-size="15">1044.63 MiB</text><rect x="20" y="258" width="400" height="12" fill="#e2e8d8"/><rect x="20" y="258" width="394.1981132075472" height="12" fill="#256580"/><text x="20" y="298" font-size="15">Immer Map</text><text x="420" y="298" text-anchor="end" font-size="15">967.56 MiB</text><rect x="20" y="308" width="400" height="12" fill="#e2e8d8"/><rect x="20" y="308" width="365.1179245283019" height="12" fill="#a7662a"/><text x="20" y="348" font-size="12">0</text><text x="420" y="348" text-anchor="end" font-size="12">1060 MiB</text><text x="20" y="430" font-size="12">Separate 8-reader run · AMD EPYC 7763</text><text x="20" y="450" font-size="12">Post-GC endpoint, not peak RSS. Not browser RAM.</text></g></svg>
