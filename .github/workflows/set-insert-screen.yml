name: Set insertion prospective screen budget continuation

on:
  push:
    branches: [proof/set-insert-screen-budget-20261014]

permissions:
  contents: read

concurrency:
  group: set-insert-screen-budget-20261014
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'natanelia/zerocopy' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read the independent proof commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          fetch-tags: false
          persist-credentials: false
      - name: Install the pinned official Node release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          check-latest: false
      - name: Candidate correctness, then one independent hosted screen
        env:
          SET_SCREEN_ROOT: ${{ runner.temp }}/set-insert-screen-budget-20261014
        run: python3 proofs/set-insert-screen/run-hosted.py "$SET_SCREEN_ROOT"
      - name: Preserve successful and negative evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: set-insert-screen-${{ github.sha }}
          path: ${{ runner.temp }}/set-insert-screen-budget-20261014/artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
