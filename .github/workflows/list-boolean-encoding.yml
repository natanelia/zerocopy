name: Boolean List append evidence

on:
  pull_request:
    paths:
      - 'list-boolean-range.test.ts'
      - 'proofs/list-boolean-encoding-20261108/**'
      - '.github/workflows/list-boolean-encoding.yml'
  push:
    branches: [main]
    paths:
      - 'list-boolean-range.test.ts'
      - 'proofs/list-boolean-encoding-20261108/**'
      - '.github/workflows/list-boolean-encoding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: list-boolean-encoding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Build the portable package and check source/value types
        run: |
          bun run build:wasm
          bun run build:browser
          bun run build:types
          bun run typecheck
          bun run typecheck:values
      - name: Check retained Lists and allocation failures in Node and Bun
        run: |
          node node_modules/vitest/vitest.mjs run list-boolean-range.test.ts shared-list.test.ts allocation-failure.test.ts --no-file-parallelism --maxWorkers=1
          bun --bun node_modules/vitest/vitest.mjs run list-boolean-range.test.ts shared-list.test.ts allocation-failure.test.ts --no-file-parallelism --maxWorkers=1
      - name: Check every workload on the current package without historical layout constraints
        run: |
          mkdir -p boolean-ci-results
          node proofs/list-boolean-encoding-20261108/smoke.mjs . . > boolean-ci-results/smoke-current-node.json
          bun proofs/list-boolean-encoding-20261108/smoke.mjs . . > boolean-ci-results/smoke-current-bun.json
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check current browser output and real workers with shared/copied attachments
        run: node proofs/list-boolean-encoding-20261108/browser.mjs . > boolean-ci-results/browser.json
      - name: Check out the benchmark baseline separately
        uses: actions/checkout@v4
        with:
          ref: a4265a0608ec25eec5719496225212db6b251989
          path: boolean-baseline
          persist-credentials: false
      - name: Build the pinned baseline with its recorded dependency versions
        run: |
          cd boolean-baseline
          bun install
          bun run build:wasm
          bun run build:browser
      - name: Rebuild the candidate commit named by the retained confirmation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boolean-ci-results
          recorded_commit="$(node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          const plain = 'proofs/list-boolean-encoding-20261108/results/formal.json';
          const path = existsSync(plain) ? plain : `${plain}.gz`;
          const bytes = readFileSync(path);
          const record = JSON.parse((path.endsWith('.gz') ? gunzipSync(bytes) : bytes).toString('utf8'));
          assert.equal(record.status, 'complete');
          assert.equal(record.mode, 'formal');
          assert.match(record.source.after.commit, /^[a-f0-9]{40}$/);
          process.stdout.write(record.source.after.commit);
          NODE
          )"
          recorded_checkout="$RUNNER_TEMP/boolean-recorded-candidate"
          if ! git cat-file -e "$recorded_commit^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$recorded_commit"
          fi
          git worktree add --detach "$recorded_checkout" "$recorded_commit"
          printf 'BOOLEAN_RECORDED_CANDIDATE=%s\n' "$recorded_checkout" >> "$GITHUB_ENV"
          cd "$recorded_checkout"
          bun install
          bun run build:wasm
          bun run build:browser
      - name: Verify historical workloads and exact arena bytes without timing
        run: |
          node proofs/list-boolean-encoding-20261108/smoke.mjs boolean-baseline "$BOOLEAN_RECORDED_CANDIDATE" > boolean-ci-results/smoke-node.json
          bun proofs/list-boolean-encoding-20261108/smoke.mjs boolean-baseline "$BOOLEAN_RECORDED_CANDIDATE" > boolean-ci-results/smoke-bun.json
          node proofs/list-boolean-encoding-20261108/allocation.mjs boolean-baseline "$BOOLEAN_RECORDED_CANDIDATE" > boolean-ci-results/allocation-node.json
          bun proofs/list-boolean-encoding-20261108/allocation.mjs boolean-baseline "$BOOLEAN_RECORDED_CANDIDATE" > boolean-ci-results/allocation-bun.json
      - name: Audit saved samples, statistics and exact source/build hashes
        run: |
          node proofs/list-boolean-encoding-20261108/verify.mjs proofs/list-boolean-encoding-20261108/results/pilot.json > boolean-ci-results/audit-pilot-v1.json
          node proofs/list-boolean-encoding-20261108/verify.mjs proofs/list-boolean-encoding-20261108/results/pilot-v2.json "$BOOLEAN_RECORDED_CANDIDATE" > boolean-ci-results/audit-pilot-v2.json
          node proofs/list-boolean-encoding-20261108/verify.mjs proofs/list-boolean-encoding-20261108/results/formal.json "$BOOLEAN_RECORDED_CANDIDATE" > boolean-ci-results/audit-formal.json
          node proofs/list-boolean-encoding-20261108/verify.mjs proofs/list-boolean-encoding-20261108/results/aa.json boolean-baseline > boolean-ci-results/audit-aa.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boolean-list-validation-${{ github.sha }}
          path: |
            proofs/list-boolean-encoding-20261108/results/
            boolean-ci-results/
          if-no-files-found: warn
          retention-days: 14
