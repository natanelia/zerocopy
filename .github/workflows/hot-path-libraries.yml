name: Hot paths and library memory

on:
  push:
    branches: [agent/immutable-performance-proof]
    paths: ['**.ts', 'proofs/**', 'scripts/**', '.github/workflows/hot-path-libraries.yml']
  pull_request:
    paths: ['**.ts', 'proofs/**', 'scripts/**', '.github/workflows/hot-path-libraries.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only superseded PR revisions cancel each other; keep standalone evidence runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run typecheck:redux
      # Main CI owns the full suite on PRs; standalone evidence runs remain complete.
      - run: bun run test
        if: github.event_name != 'pull_request' || github.base_ref != 'main'
      - run: bunx playwright install --with-deps chromium
        if: github.event_name != 'pull_request' || github.base_ref != 'main'
      - run: bun run test:browser
        if: github.event_name != 'pull_request' || github.base_ref != 'main'
      - name: Compare warm paths, cold paths, and retained memory
        run: bash proofs/run-hot-path-evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-path-library-evidence
          path: |
            proofs/results/hot-path/
            proofs/results/cold-build/
          retention-days: 90
