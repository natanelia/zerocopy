name: Retained map compaction paired screen (temporary proof)
on:
  push:
    branches: [proof/retained-map-compaction-20261125]
permissions:
  contents: read
jobs:
  browser-handoff:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - run: bun install --frozen-lockfile
      - name: Build pinned baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 76ab6b53aa0d3b40202720ca12d9fcc904716cf2 HEAD
          cp compaction.ts /tmp/retained-candidate.ts
          git show 76ab6b53aa0d3b40202720ca12d9fcc904716cf2:compaction.ts > compaction.ts
          bun run build:wasm && bun run build:browser
          cp -a dist baseline-dist
          cp -a dist control-dist
          cp /tmp/retained-candidate.ts compaction.ts
          bun run build:browser
          git diff --exit-code -- compaction.ts
      - name: Verify exact runtime source
        run: git diff --exit-code 3f8f0d89fb4fa95fec87bcce52ff21c44652fd3d -- compaction.ts
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Measure real browser reader handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p retained-compaction-results
          node proofs/retained-map-compaction-browser-run.mjs ${{ matrix.browser }} retained-compaction-results/browser.json | tee retained-compaction-results/run.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: retained-handoff-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained-compaction-results/
          retention-days: 14
          if-no-files-found: error
