name: Retained map compaction focused fallback qualification (temporary proof)
on:
  push:
    branches: [proof/retained-map-compaction-20261125]
    paths: ['.github/workflows/retained-map-compaction-proof.yml', 'compaction.ts', 'arena.ts', 'shared-map.ts']
permissions:
  contents: read
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        runtime: [node]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - run: bun install --frozen-lockfile
      - name: Build pinned baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 6cf0dee378f3225ec9934638fcc3056e79b7cabb -- compaction.ts arena.ts shared-map.ts
          git diff --name-only 76ab6b53aa0d3b40202720ca12d9fcc904716cf2 HEAD
          for file in compaction.ts arena.ts shared-map.ts; do
            cp "$file" "/tmp/retained-$file"
            git show "76ab6b53aa0d3b40202720ca12d9fcc904716cf2:$file" > "$file"
          done
          bun run build:wasm && bun run build:browser
          cp -a dist baseline-dist
          cp -a dist control-dist
          for file in compaction.ts arena.ts shared-map.ts; do cp "/tmp/retained-$file" "$file"; done
          bun run build:browser
          git diff --exit-code 6cf0dee378f3225ec9934638fcc3056e79b7cabb -- compaction.ts arena.ts shared-map.ts
          git hash-object compaction.ts arena.ts shared-map.ts
          node --version && bun --version
          sha256sum baseline-dist/*.js control-dist/*.js dist/*.js
      - name: Measure paired retained revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p retained-compaction-results
          python3 - <<'PY'
          from pathlib import Path
          p=Path('proofs/retained-map-compaction-paired-20261125.mjs')
          s=p.read_text()
          old="""for(const n of [10000,100000]){
           for(const mode of ['one','two','eight','alias-eight','churn','dense','dense-four']){
             for(const cohort of ['AB','AA']){
               const arms=cohort==='AB'?[['base',baseline],['candidate',candidate]]:[['base',baseline],['control',control]];
               for(let pair=-1;pair<(cohort==='AB'?7:3);pair++){"""
          new="""for(const n of [10000]){
           for(const mode of ['dense-four']){
             for(let pair=-1;pair<21;pair++){
               for(const cohort of (pair%2===0?['AB','AA']:['AA','AB'])){
                 const arms=cohort==='AB'?[['base',baseline],['candidate',candidate]]:[['base',baseline],['control',control]];"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          if [ "${{ matrix.runtime }}" = node ]; then
            node --expose-gc proofs/retained-map-compaction-paired-20261125.mjs retained-compaction-results/node.json | tee retained-compaction-results/run.log
          else
            bun proofs/retained-map-compaction-paired-20261125.mjs retained-compaction-results/bun.json | tee retained-compaction-results/run.log
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: retained-compaction-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained-compaction-results/
          retention-days: 14
          if-no-files-found: error
  browser-handoff:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - run: bun install --frozen-lockfile
      - name: Build pinned baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 6cf0dee378f3225ec9934638fcc3056e79b7cabb -- compaction.ts arena.ts shared-map.ts
          git diff --name-only 76ab6b53aa0d3b40202720ca12d9fcc904716cf2 HEAD
          for file in compaction.ts arena.ts shared-map.ts; do
            cp "$file" "/tmp/retained-$file"
            git show "76ab6b53aa0d3b40202720ca12d9fcc904716cf2:$file" > "$file"
          done
          bun run build:wasm && bun run build:browser
          cp -a dist baseline-dist
          cp -a dist control-dist
          for file in compaction.ts arena.ts shared-map.ts; do cp "/tmp/retained-$file" "$file"; done
          bun run build:browser
          git diff --exit-code 6cf0dee378f3225ec9934638fcc3056e79b7cabb -- compaction.ts arena.ts shared-map.ts
          git hash-object compaction.ts arena.ts shared-map.ts
          node --version && bun --version
          sha256sum baseline-dist/*.js control-dist/*.js dist/*.js
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Measure real browser reader handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p retained-compaction-results
          python3 - <<'PY'
          from pathlib import Path
          p=Path('proofs/retained-map-compaction-browser-run.mjs')
          s=p.read_text()
          old=""" for(const [n,mode] of [[100000,'eight'],[100000,'shuffled'],[100000,'churn'],[100000,'dense-four'],[10000,'eight']]){
            for(const cohort of ['AB','AA']){
             const arms=cohort==='AB'?['base','candidate']:['base','control'];
             for(let pair=-1;pair<(cohort==='AB'?5:3);pair++){"""
          new=""" for(const [n,mode] of [[100000,browserName==='firefox'?'churn':'dense-four']]){
            for(let pair=-1;pair<15;pair++){
             for(const cohort of (pair%2===0?['AB','AA']:['AA','AB'])){
              const arms=cohort==='AB'?['base','candidate']:['base','control'];"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          node proofs/retained-map-compaction-browser-run.mjs ${{ matrix.browser }} retained-compaction-results/browser.json | tee retained-compaction-results/run.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: retained-handoff-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained-compaction-results/
          retention-days: 14
          if-no-files-found: error
