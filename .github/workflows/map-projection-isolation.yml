name: Map projection single-build diagnostic
on:
  push:
    branches: [perf/map-projection-isolation-20261008]
    paths:
      - 'proofs/map-projection-isolation.mjs'
      - '.github/workflows/map-projection-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    if: github.repository == 'natanelia/zerocopy' && github.ref == 'refs/heads/perf/map-projection-isolation-20261008'
    strategy:
      fail-fast: false
      matrix:
        runtime: [chromium, firefox, webkit]
        suite: [controls, targets]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASELINE_COMMIT: 3331f2f0e9e0c3c61832e5f04b12e18c1889d96c
      CANDIDATE_COMMIT: 2ba4cb3b7761f7d59289faa6252404841267726f
      RUNTIME: ${{ matrix.runtime }}
      SUITE: ${{ matrix.suite }}
      BLOCKS: '4'
      SEED: '20261008'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.2' }
      - run: bun install
      - name: Build only the two immutable pinned sources with one toolchain
        run: |
          set -euo pipefail
          mkdir -p .isolation-baseline .isolation-candidate proofs/results/map-projection-isolation
          git archive "$BASELINE_COMMIT" | tar -x -C .isolation-baseline
          git archive "$CANDIDATE_COMMIT" | tar -x -C .isolation-candidate
          ln -s "$PWD/node_modules" .isolation-baseline/node_modules
          ln -s "$PWD/node_modules" .isolation-candidate/node_modules
          (cd .isolation-baseline && bun run build:wasm && bun run build:browser)
          (cd .isolation-candidate && bun run build:wasm && bun run build:browser)
          printf '%s\n' "$BASELINE_COMMIT" > proofs/results/map-projection-isolation/base-commit.txt
          printf '%s\n' "$CANDIDATE_COMMIT" > proofs/results/map-projection-isolation/candidate-commit.txt
          git rev-parse HEAD > proofs/results/map-projection-isolation/diagnostic-commit.txt
          (node --version; bun --version; node -p 'JSON.stringify({assemblyscript:require("./node_modules/assemblyscript/package.json").version,playwright:require("./node_modules/playwright/package.json").version,typescript:require("./node_modules/typescript/package.json").version})') > proofs/results/map-projection-isolation/tool-versions.txt
      - name: Install only the selected browser engine
        run: bunx playwright install --with-deps "$RUNTIME"
      - name: Run serial fresh-browser A/B and interleaved process-level A/A blocks
        run: |
          node --check proofs/map-projection-isolation.mjs
          node proofs/map-projection-isolation.mjs .isolation-baseline/dist/shared.js .isolation-candidate/dist/shared.js "proofs/results/map-projection-isolation/$RUNTIME-$SUITE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-projection-single-build-${{ matrix.runtime }}-${{ matrix.suite }}-${{ github.sha }}
          path: proofs/results/map-projection-isolation/
          retention-days: 30
          if-no-files-found: error
