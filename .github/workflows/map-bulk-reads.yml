name: Rejected Map bulk-read experiment verification

on:
  pull_request:
    paths:
      - 'map-get-many.test.ts'
      - 'proofs/map-bulk-reads-20261108/**'
      - '.github/workflows/map-bulk-reads.yml'
  push:
    branches: [main]
    paths:
      - 'map-get-many.test.ts'
      - 'proofs/map-bulk-reads-20261108/**'
      - '.github/workflows/map-bulk-reads.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-bulk-reads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Build the package and check source/value types
        run: |
          mkdir -p map-bulk-ci-results
          bun run build:wasm
          bun run build:browser
          bun run build:types
          bun run typecheck
          bun run typecheck:values
      - name: Check scalar and bulk Map reads in Node and Bun
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run map-get-many.test.ts shared-map.test.ts typed-values.test.ts --no-file-parallelism --maxWorkers=1 | tee map-bulk-ci-results/tests-node.txt
          bun --bun node_modules/vitest/vitest.mjs run map-get-many.test.ts shared-map.test.ts typed-values.test.ts --no-file-parallelism --maxWorkers=1 | tee map-bulk-ci-results/tests-bun.txt
      - name: Build the pinned baseline in an isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          map_bulk_baseline="$RUNNER_TEMP/map-bulk-baseline"
          git worktree add --detach "$map_bulk_baseline" a4265a0608ec25eec5719496225212db6b251989
          printf 'MAP_BULK_BASELINE=%s\n' "$map_bulk_baseline" >> "$GITHUB_ENV"
          cd "$map_bulk_baseline"
          bun install
          bun run build:wasm
          bun run build:browser
      - name: Check every workload on the current package
        run: |
          node proofs/map-bulk-reads-20261108/smoke.mjs . . > map-bulk-ci-results/smoke-current-node.json
          bun proofs/map-bulk-reads-20261108/smoke.mjs . . > map-bulk-ci-results/smoke-current-bun.json
      - name: Check current Node readers with shared/copied attachments
        run: |
          node proofs/map-bulk-reads-20261108/worker.mjs . > map-bulk-ci-results/worker-current.json
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check Chromium output and real worker readers
        run: node proofs/map-bulk-reads-20261108/browser.mjs . > map-bulk-ci-results/browser.json
      - name: Rebuild the recorded rejected candidate for archive verification
        shell: bash
        run: |
          set -euo pipefail
          recorded_commit="$(node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          const plain = 'proofs/map-bulk-reads-20261108/results/formal.json';
          const path = existsSync(plain) ? plain : `${plain}.gz`;
          const bytes = readFileSync(path);
          const record = JSON.parse((path.endsWith('.gz') ? gunzipSync(bytes) : bytes).toString('utf8'));
          assert.equal(record.status, 'complete');
          assert.equal(record.mode, 'formal');
          assert.match(record.source.after.commit, /^[a-f0-9]{40}$/);
          process.stdout.write(record.source.after.commit);
          NODE
          )"
          recorded_checkout="$RUNNER_TEMP/map-bulk-recorded-candidate"
          if ! git cat-file -e "$recorded_commit^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$recorded_commit"
          fi
          git worktree add --detach "$recorded_checkout" "$recorded_commit"
          printf 'MAP_BULK_RECORDED_CANDIDATE=%s\n' "$recorded_checkout" >> "$GITHUB_ENV"
          cd "$recorded_checkout"
          bun install
          bun run build:wasm
          bun run build:browser
      - name: Check historical workloads and cross-version readers without timing
        run: |
          proof=proofs/map-bulk-reads-20261108
          node "$proof/smoke.mjs" "$MAP_BULK_BASELINE" "$MAP_BULK_RECORDED_CANDIDATE" > map-bulk-ci-results/smoke-historical-node.json
          bun "$proof/smoke.mjs" "$MAP_BULK_BASELINE" "$MAP_BULK_RECORDED_CANDIDATE" > map-bulk-ci-results/smoke-historical-bun.json
          node "$proof/worker.mjs" "$MAP_BULK_RECORDED_CANDIDATE" "$MAP_BULK_BASELINE" > map-bulk-ci-results/worker-historical-baseline.json
      - name: Audit all saved samples and exact historical source/build hashes
        run: |
          proof=proofs/map-bulk-reads-20261108
          gzip -dc "$proof/results/pilot-v1.json.gz" > "$RUNNER_TEMP/map-bulk-pilot-v1.json"
          gzip -dc "$proof/results/aa-diagnostic-v1.json.gz" > "$RUNNER_TEMP/map-bulk-local-aa.json"
          node "$proof/exploration/v1/verify.mjs" "$RUNNER_TEMP/map-bulk-pilot-v1.json" > map-bulk-ci-results/audit-pilot-v1.json
          node "$proof/exploration/v1/verify.mjs" "$RUNNER_TEMP/map-bulk-local-aa.json" "$MAP_BULK_BASELINE" > map-bulk-ci-results/audit-local-aa.json
          node "$proof/verify.mjs" "$proof/results/pilot-v2-hosted.json" "$MAP_BULK_RECORDED_CANDIDATE" > map-bulk-ci-results/audit-pilot-v2-hosted.json
          node "$proof/verify.mjs" "$proof/results/formal.json" "$MAP_BULK_RECORDED_CANDIDATE" > map-bulk-ci-results/audit-formal.json
          node "$proof/verify.mjs" "$proof/results/aa.json" "$MAP_BULK_BASELINE" > map-bulk-ci-results/audit-aa.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-bulk-read-evidence-${{ github.sha }}
          path: |
            proofs/map-bulk-reads-20261108/results/
            proofs/map-bulk-reads-20261108/validation/
            map-bulk-ci-results/
          if-no-files-found: warn
          retention-days: 14
