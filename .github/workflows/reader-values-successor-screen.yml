# SOURCE ONLY: the four __SUCCESSOR_*__ fields must be pinned after successful correctness and reviewed again.
# run.mjs and method.md each change only the candidate patch identity literal; scientific definitions are unchanged.
# Final acceptance MUST inspect both download-artifact logs. Any digest-mismatch warning invalidates all screen results.
# SOURCE ONLY: publish/push only after coordinator release and successful
# isolated correctness. Place the five sealed files in proofs/session-cache-screen/
# and the exact sealed patch in proofs/session-cache-screen.patch on this controller
# ref. The controller ref may differ from the exact tested candidate commit.
# This reuses the correctness artifacts; it never installs, rebuilds, or retests.
# These literal pins identify the verified correctness proof. They do not imply
# success. Require its terminal success and an independent final review before
# the immutable controller's first push; the workflow rechecks success itself.
name: Reader values successor hosted screen

on:
  push:
    branches: [proof/reader-values-successor-screen-20261014]

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE_SHA: afdffdcfcbd61013f120de82411c0c4a6b2d1e0e
      CANDIDATE_SHA: '83afeb40dd6a4efa8e2db88c18b60605b4e226d8'
      BASELINE_CORRECTNESS_RUN: '38587533621'
      CANDIDATE_CORRECTNESS_RUN: '38593978261'
      CANDIDATE_ARTIFACT_ID: '11908542898'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:8c0733dee8620abacaad986c52a6dd519de334ef62a7d66a1b69ae2cd732e470'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: afdffdcfcbd61013f120de82411c0c4a6b2d1e0e
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Require exact successful correctness and artifact identities
        id: correctness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const env = process.env, repository = env.GITHUB_REPOSITORY;
          assert.equal(env.GITHUB_RUN_ATTEMPT, '1', 'A new cohort requires its first attempt; no automatic resampling');
          assert.match(env.CANDIDATE_SHA, /^[0-9a-f]{40}$/);
          assert.notEqual(env.CANDIDATE_SHA, 'edf628f7d735081c761fb685e34c1a9500ec46b2', 'The rejected predecessor is not this successor');
          assert.match(env.CANDIDATE_CORRECTNESS_RUN, /^[1-9][0-9]*$/);
          assert.match(env.CANDIDATE_ARTIFACT_ID, /^[1-9][0-9]*$/);
          assert.match(env.CANDIDATE_ARTIFACT_DIGEST, /^sha256:[0-9a-f]{64}$/);
          assert.notEqual(env.CANDIDATE_CORRECTNESS_RUN, env.BASELINE_CORRECTNESS_RUN);
          assert.equal(sha(readFileSync('candidate/.github/workflows/reader-values-successor-correctness.yml')),
            'a0e21850aa91987ad4684cc1ee340c446612ee3f292538e832e5fd1a52a3dd66');
          const get = async suffix => {
            const response = await fetch(`https://api.github.com/repos/${repository}/${suffix}`, {
              headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(30000),
            });
            assert.ok(response.ok, `GitHub read failed: ${response.status}`);
            return response.json();
          };
          const originalWorkflow = await get('contents/.github/workflows/reader-values-correctness.yml?ref=edf628f7d735081c761fb685e34c1a9500ec46b2');
          assert.equal(originalWorkflow.encoding, 'base64');
          assert.equal(sha(Buffer.from(originalWorkflow.content, 'base64')),
            '7f265cbd035b124fdbcd31ea4807355b98e9efc40c0c3f0f9c271238fa778fd7');
          const specs = [
            { arm: 'baseline', runId: env.BASELINE_CORRECTNESS_RUN, head: 'edf628f7d735081c761fb685e34c1a9500ec46b2',
              branch: 'proof/reader-values-correctness-20261014', name: 'Reader values correctness',
              path: '.github/workflows/reader-values-correctness.yml', commit: env.BASELINE_SHA,
              artifactId: '11905688356', digest: 'sha256:b16696cacf6dde4688ff5238d762680e2f80ffbc4b410aed6e54b02dfb663e02',
              jobs: ['correctness (baseline)', 'correctness (candidate)'] },
            { arm: 'candidate', runId: env.CANDIDATE_CORRECTNESS_RUN, head: env.CANDIDATE_SHA,
              branch: 'proof/reader-values-successor-correctness-20261014', name: 'Reader values successor correctness',
              path: '.github/workflows/reader-values-successor-correctness.yml', commit: env.CANDIDATE_SHA,
              artifactId: env.CANDIDATE_ARTIFACT_ID, digest: env.CANDIDATE_ARTIFACT_DIGEST,
              jobs: ['correctness'] },
          ];
          const receipts = {};
          for (const spec of specs) {
            const run = await get(`actions/runs/${spec.runId}`);
            assert.equal(String(run.id), spec.runId); assert.equal(run.run_attempt, 1);
            assert.equal(run.name, spec.name); assert.equal(run.path, spec.path);
            assert.equal(run.repository.full_name, repository); assert.equal(run.event, 'push');
            assert.equal(run.head_sha, spec.head); assert.equal(run.head_branch, spec.branch);
            assert.equal(run.status, 'completed'); assert.equal(run.conclusion, 'success');
            const jobs = await get(`actions/runs/${run.id}/jobs?per_page=100`);
            assert.equal(jobs.total_count, spec.jobs.length);
            assert.deepEqual(jobs.jobs.map(j => j.name).sort(), [...spec.jobs].sort());
            for (const job of jobs.jobs) { assert.equal(job.status, 'completed'); assert.equal(job.conclusion, 'success'); }
            const listing = await get(`actions/runs/${run.id}/artifacts?per_page=100`);
            assert.ok(listing.total_count <= 100, 'Unexpected artifact count; coordinator review required');
            const matches = listing.artifacts.filter(a => String(a.id) === spec.artifactId
              && a.name === `test-evidence-${spec.commit}` && !a.expired);
            assert.equal(matches.length, 1, `Expected exact ${spec.arm} artifact identity`);
            const a = matches[0];
            assert.equal(a.digest, spec.digest, `${spec.arm} artifact digest changed`);
            assert.equal(a.workflow_run.id, run.id); assert.equal(a.workflow_run.head_sha, spec.head);
            assert.ok(Date.parse(a.created_at) >= Date.parse(run.run_started_at), 'Artifact predates this successful attempt');
            receipts[spec.arm] = { runId: run.id, runAttempt: run.run_attempt, url: run.html_url,
              workflowPath: run.path, headSha: run.head_sha, testedCommit: spec.commit, conclusion: run.conclusion,
              artifact: { id: a.id, name: a.name, digest: a.digest, createdAt: a.created_at } };
            appendFileSync(env.GITHUB_OUTPUT, `${spec.arm}_artifact=${a.id}\n`);
          }
          appendFileSync(env.GITHUB_OUTPUT, `receipt=${JSON.stringify(receipts)}\n`);
          NODE
      # v4 treats only name-based downloads as single-artifact downloads. Force
      # a flat destination for one artifact ID: retained/<arm>/dist, not an
      # extra test-evidence-<sha>/ directory. Official implementation:
      # github.com/actions/download-artifact/blob/v4/src/download-artifact.ts#L158-L166
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.correctness.outputs.baseline_artifact }}
          run-id: ${{ env.BASELINE_CORRECTNESS_RUN }}
          github-token: ${{ github.token }}
          path: retained/baseline
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.correctness.outputs.candidate_artifact }}
          run-id: ${{ env.CANDIDATE_CORRECTNESS_RUN }}
          github-token: ${{ github.token }}
          path: retained/candidate
          merge-multiple: true
      - name: Bind actual exact source, retained builds, runtimes and hosted cohort
        env:
          CI_RECEIPT: ${{ steps.correctness.outputs.receipt }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, lstatSync, realpathSync, writeFileSync } from 'node:fs';
          import { resolve, join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const walk = (root, dir = '') => readdirSync(join(root, dir)).sort().flatMap(name => {
            const path = join(dir, name), stat = lstatSync(join(root, path));
            assert.ok(!stat.isSymbolicLink(), `Symlink: ${path}`);
            return stat.isDirectory() ? walk(root, path) : stat.isFile() ? [path] : [];
          });
          const inventory = (root, paths) => sha(JSON.stringify(Object.fromEntries(paths.sort().map(path => [path, sha(readFileSync(join(root, path)))]))));
          const packet = resolve('control/proofs/session-cache-screen');
          const harnessSha256 = inventory(packet, ['cases.mjs', 'method.md', 'run.mjs', 'subject.mjs', 'summarize.mjs']);
          assert.equal(harnessSha256, '1482bacfa02cbdc6d09cf6c2afab34a632076eca7ca94360740dde44fb01c229');
          const patch = resolve('control/proofs/session-cache-screen.patch');
          assert.equal(sha(readFileSync(patch)), 'a35ea546b7e51ffb27aa34e0baf484f23cfd99c4007a3060ffc640156a390d29');
          const variants = {}, archives = {}, locks = {};
          for (const [arm, commit] of [['baseline', process.env.BASELINE_SHA], ['candidate', process.env.CANDIDATE_SHA]]) {
            const sourceRoot = resolve(arm), retained = resolve('retained', arm), buildRoot = join(retained, 'dist');
            assert.equal(execFileSync('git', ['-C', sourceRoot, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), commit);
            const archive = readFileSync(join(retained, 'tested-source.tar'));
            assert.equal(sha(execFileSync('git', ['-C', sourceRoot, 'archive', '--format=tar', 'HEAD'], { maxBuffer: 128 * 1024 * 1024 })), sha(archive), `${arm} archive differs from exact checkout`);
            assert.equal(sha(readFileSync(join(retained, 'package.json'))), sha(readFileSync(join(sourceRoot, 'package.json'))));
            const sourceFiles = readdirSync(sourceRoot).filter(name => {
              if (!/\.(ts|json|wasm)$/.test(name)) return false;
              const stat = lstatSync(join(sourceRoot, name)); assert.ok(!stat.isSymbolicLink()); return stat.isFile();
            }).concat(walk(join(sourceRoot, 'scripts')).map(name => join('scripts', name)));
            variants[arm] = { sourceRoot, sourceSha256: inventory(sourceRoot, sourceFiles), buildRoot, buildSha256: inventory(buildRoot, walk(buildRoot)) };
            archives[arm] = { commit, sha256: sha(archive) };
            locks[arm] = sha(readFileSync(join(retained, 'bun.lock')));
          }
          assert.equal(locks.baseline, locks.candidate, 'Correctness arms used different dependency locks');
          assert.equal(process.versions.node, '22.16.0');
          const bun = realpathSync(execFileSync('which', ['bun'], { encoding: 'utf8' }).trim());
          assert.equal(execFileSync(bun, ['--version'], { encoding: 'utf8' }).trim(), '1.4.2');
          const engines = [['node', realpathSync(process.execPath), '22.16.0'], ['bun', bun, '1.4.2']]
            .map(([name, executable, version]) => ({ name, executable, version, sha256: sha(readFileSync(executable)) }));
          const manifest = { release: 'session-cache-screen-v1', baselineCommit: process.env.BASELINE_SHA,
            candidateCommit: process.env.CANDIDATE_SHA, successorOf: 'edf628f7d735081c761fb685e34c1a9500ec46b2',
            candidatePatchFile: patch, candidatePatchSha256: sha(readFileSync(patch)), harnessSha256, engines, variants,
            cohort: { label: 'github-hosted-successor-ubuntu-latest', localEquivalence: false,
              repository: process.env.GITHUB_REPOSITORY, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              controllerSha: process.env.GITHUB_SHA, runnerName: process.env.RUNNER_NAME, imageOS: process.env.ImageOS ?? null,
              imageVersion: process.env.ImageVersion ?? null, correctness: JSON.parse(process.env.CI_RECEIPT), archives, locks } };
          writeFileSync(join(process.env.RUNNER_TEMP, 'session-screen-release.json'), JSON.stringify(manifest, null, 2), { flag: 'wx' });
          NODE
      - name: Run the fixed successor screen once
        timeout-minutes: 13
        shell: bash
        run: node "$GITHUB_WORKSPACE/control/proofs/session-cache-screen/run.mjs" "$RUNNER_TEMP/session-screen-release.json" "$RUNNER_TEMP/session-screen-results"
      - name: Retain every result and exact inputs, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-values-successor-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/session-screen-release.json
            ${{ runner.temp }}/session-screen-results/
            retained/
          retention-days: 14
          if-no-files-found: warn
