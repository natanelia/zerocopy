name: Numeric pairing retained replay
on:
  push:
    branches: [proof/numeric-pairing-diagnostic-20261018]
    paths:
      - '.github/workflows/numeric-pairing-replay.yml'
      - 'proofs/experiments/numeric-pairing-20261018/replay/replay-source.tar.xz'
      - 'proofs/experiments/numeric-pairing-20261018/replay/replay-source.sha256'
permissions:
  contents: write
concurrency:
  group: numeric-pairing-retained-replay
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PROOF: proofs/experiments/numeric-pairing-20261018
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check the fixed inputs and unpack the retained records
        run: |
          (cd "$PROOF/replay" && sha256sum -c replay-source.sha256)
          echo 'c47098bfa2c34c916b058fd38b3178dc85289b68b69141c88afeeea90ef837fb  numeric-tree-X64-d16d82c9.zip' | (cd "$PROOF/inputs" && sha256sum -c -)
          echo '7afbdb14c8c75f812e085e82c742d5c72af35d014f4545a84a07c85c7a04f51d  raw.tar.xz' | (cd "$PROOF/runs/39103580864" && sha256sum -c -)
          mkdir "$RUNNER_TEMP/replay-source" "$RUNNER_TEMP/paired-raw" "$RUNNER_TEMP/original"
          tar -xJf "$PROOF/replay/replay-source.tar.xz" -C "$RUNNER_TEMP/replay-source"
          tar -xJf "$PROOF/runs/39103580864/raw.tar.xz" -C "$RUNNER_TEMP/paired-raw"
          python3 - <<'PY'
          import io,os,pathlib,tarfile,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=pathlib.Path(os.environ['PROOF'])/'inputs/numeric-tree-X64-d16d82c9.zip'
          with zipfile.ZipFile(archive) as z:
              with tarfile.open(fileobj=io.BytesIO(z.read('candidate-source.tar'))) as t:
                  t.extractall(root/'original',filter='data')
          PY
          find "$RUNNER_TEMP/paired-raw" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/before.sha256"
      - name: Test the substitutions and replay both unchanged methods
        run: |
          DEST="$PROOF/replay-runs/$GITHUB_RUN_ID"
          mkdir -p "$DEST"
          export EVIDENCE_STAGE="$RUNNER_TEMP/paired-raw/pairing"
          export ORIGINAL_DRIVER="$RUNNER_TEMP/original/proofs/numeric-tree-process.mjs"
          node --test "$RUNNER_TEMP/replay-source/verify-retained.test.mjs" > "$DEST/tests.txt" 2>&1
          for METHOD in pairing pairing-longbatch; do
            node "$RUNNER_TEMP/replay-source/verify-retained.mjs" "$RUNNER_TEMP/paired-raw/$METHOD" "$ORIGINAL_DRIVER" "$DEST/$METHOD.json" > "$DEST/$METHOD-node.log" 2>&1
            python3 "$RUNNER_TEMP/replay-source/verify-retained.py" "$RUNNER_TEMP/paired-raw/$METHOD" "$DEST/$METHOD.json" "$DEST/$METHOD-independent.json" > "$DEST/$METHOD-python.log" 2>&1
          done
          find "$RUNNER_TEMP/paired-raw" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/after.sha256"
          cmp "$RUNNER_TEMP/before.sha256" "$RUNNER_TEMP/after.sha256"
          cp "$RUNNER_TEMP/before.sha256" "$DEST/unchanged-inputs.sha256"
      - name: Retain replay results and readable source without running measurements
        if: always()
        run: |
          DEST="$PROOF/replay-runs/$GITHUB_RUN_ID"
          mkdir -p "$DEST"
          printf '%s\n' "$GITHUB_SHA" > "$DEST/verifier-commit.txt"
          printf '%s\n' '39103580864' > "$DEST/measurement-run.txt"
          if test -f "$RUNNER_TEMP/replay-source/verify-retained.mjs"; then
            mkdir -p "$PROOF/replay/source"
            cp "$RUNNER_TEMP/replay-source/"* "$PROOF/replay/source/"
          fi
          find "$DEST" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$DEST/SHA256SUMS"
          echo 'This job replays retained data only. No measurements or performance gates were rerun. Passing replay checks is not performance clearance.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-pairing-replay-${{ github.run_id }}
          path: proofs/experiments/numeric-pairing-20261018/replay-runs/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve replay evidence in Git without a force push
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$PROOF/replay-runs/$GITHUB_RUN_ID"
          test ! -d "$PROOF/replay/source" || git add -f -- "$PROOF/replay/source"
          git diff --cached --quiet && exit 0
          git commit -m "proof(numeric): retain unchanged-data replay $GITHUB_RUN_ID"
          git push origin 'HEAD:refs/heads/proof/numeric-pairing-diagnostic-20261018'
