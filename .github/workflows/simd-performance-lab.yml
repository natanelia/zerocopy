name: SIMD performance lab
on:
  push:
    branches: [agent/simd-performance-lab]
    paths: ['proofs/simd/**', '.github/workflows/simd-performance-lab.yml']
permissions:
  contents: read
concurrency:
  group: simd-performance-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Build, verify, and compare isolated variants and public APIs
        run: node proofs/simd/refined.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simd-experiments-${{ runner.arch }}
          path: .simd-lab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
