name: Frozen vector path reservation gate

on:
  push:
    branches: [perf/vector-path-reservation-gate-20261008]

permissions:
  contents: read

concurrency:
  group: vector-path-reservation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/perf/vector-path-reservation-gate-20261008' && github.run_attempt == 1 && github.event.before == '0432589af7f62fe6d8411eeb97c6296fd32fe572' && !github.event.forced && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require the first workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve original observed study and failed packaging history
        run: |
          mkdir -p "$RUNNER_TEMP/vector-reservation-results/history"
          cp proofs/vector-reservation-first-attempt.json "$RUNNER_TEMP/vector-reservation-results/history/first-attempt-audit.json"
          cp proofs/vector-reservation-first-attempt.log "$RUNNER_TEMP/vector-reservation-results/history/first-attempt-job.log"
          git archive 0432589af7f62fe6d8411eeb97c6296fd32fe572 > "$RUNNER_TEMP/vector-reservation-results/history/original-proof-source.tar"
          git show 0432589af7f62fe6d8411eeb97c6296fd32fe572:.github/workflows/vector-path-reservation.yml > "$RUNNER_TEMP/vector-reservation-results/history/original-workflow.yml"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Check evidence archive roundtrip and original observed history
        run: node --test proofs/vector-reservation-evidence-tests.node.mjs
      - name: Prepare exact baseline outside project test discovery
        run: |
          bun install
          git worktree add --detach "$RUNNER_TEMP/vector-reservation-baseline" 3773c6e519c7c0958da13727ed1082f449f3ee25
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/vector-reservation-baseline/node_modules"
          node -e "require('node:assert/strict').equal(process.arch, 'x64')"
      - name: Fresh WASM, portable, and declaration builds with extracted package guards
        run: node proofs/vector-reservation-build.mjs "$RUNNER_TEMP/vector-reservation-baseline" . "$RUNNER_TEMP/vector-reservation-results/build.json"
      - name: Install Chromium for clean correctness prerequisites
        run: bunx playwright install --with-deps chromium
      - name: Require clean full suites, all types, packages, invariants, and actual workers
        run: node proofs/vector-reservation-prerequisites.mjs "$RUNNER_TEMP/vector-reservation-baseline/dist/shared.js" dist/shared.js "$RUNNER_TEMP/vector-reservation-results/build.json" "$RUNNER_TEMP/vector-reservation-results/prerequisites.json"
      - name: Run the fixed Node 22 x64 A/A and A/B quartets
        run: node proofs/vector-reservation-performance.mjs "$RUNNER_TEMP/vector-reservation-baseline/dist/shared.js" dist/shared.js "$RUNNER_TEMP/vector-reservation-results/node.json" "$RUNNER_TEMP/vector-reservation-results/build.json" "$RUNNER_TEMP/vector-reservation-results/prerequisites.json"
      - name: Run the fixed Bun 1.4.2 x64 A/A and A/B quartets
        run: bun proofs/vector-reservation-performance.mjs "$RUNNER_TEMP/vector-reservation-baseline/dist/shared.js" dist/shared.js "$RUNNER_TEMP/vector-reservation-results/bun.json" "$RUNNER_TEMP/vector-reservation-results/build.json" "$RUNNER_TEMP/vector-reservation-results/prerequisites.json"
      - name: Archive exact tested source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/vector-reservation-results"
          git archive --format=tar HEAD > "$RUNNER_TEMP/vector-reservation-results/tested-source.tar"
      - name: Archive complete or partial evidence with original paths and bytes
        if: always()
        run: node proofs/archive-vector-reservation-evidence.mjs "$RUNNER_TEMP/vector-reservation-results" "$RUNNER_TEMP/vector-reservation-upload"
      - name: Retain complete or partial portable evidence archive
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-reservation-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vector-reservation-upload/vector-reservation.tar.gz
            ${{ runner.temp }}/vector-reservation-upload/vector-reservation.tar.gz.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
