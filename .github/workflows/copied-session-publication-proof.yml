name: Copied session transfer final Bun control and permanent proof (proof only)
on:
  push:
    branches: [proof/copied-session-publication-20261126]
    paths: ['.github/workflows/copied-session-publication-proof.yml', 'proofs/copied-session-transfer-paired-20261126.mjs']
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        mode: [bun-control, permanent]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - name: Check exact source and versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 2c1998c4accef3f0e451f9ec406ac6a467e7ca15 HEAD -- worker.ts worker-protocol.ts arena.ts shared.ts shared-map.ts persistent-core
          node --version
          bun --version
          mkdir -p copied-session-results
      - name: Measure only outstanding Bun 10k default and AA controls
        if: matrix.mode == 'bun-control'
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          for file in worker.ts worker-protocol.ts; do
            cp "$file" "/tmp/copy-$file"
            git show "d57fc413ee5f67d0839f5a3a8ff36f4a51fb0341:$file" > "$file"
          done
          bun run build:wasm && bun run build:browser
          cp -a dist baseline-dist
          cp -a dist control-dist
          for file in worker.ts worker-protocol.ts; do cp "/tmp/copy-$file" "$file"; done
          git diff --exit-code 2c1998c4accef3f0e451f9ec406ac6a467e7ca15 -- worker.ts worker-protocol.ts
          bun run build:browser
          sha256sum worker.ts worker-protocol.ts persistent-core.wasm baseline-dist/*.js control-dist/*.js dist/*.js
          bun proofs/copied-session-transfer-paired-20261126.mjs copied-session-results/raw.json focused-bun | tee copied-session-results/run.log
      - name: Test permanent regression proof on exact production commit
        if: matrix.mode == 'permanent'
        shell: bash
        run: |
          set -euo pipefail
          results="$PWD/copied-session-results"
          git worktree add --detach "$RUNNER_TEMP/candidate" 2c1998c4accef3f0e451f9ec406ac6a467e7ca15
          cd "$RUNNER_TEMP/candidate"
          test "$(git rev-parse HEAD)" = "2c1998c4accef3f0e451f9ec406ac6a467e7ca15"
          git rev-parse HEAD > "$results/candidate.txt"
          bun install --frozen-lockfile
          bun run build:wasm && bun run build:browser && bun run build:types
          bun run typecheck
          bunx tsc --noEmit -p tsconfig.worker.json
          sha256sum worker.ts worker-protocol.ts persistent-core.wasm dist/shared.js dist/worker.js > "$results/hashes.txt"
          node proofs/worker-sessions.mjs 2>&1 | tee "$results/node.log"
          bun proofs/worker-session-transfers.mjs 2>&1 | tee "$results/bun.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: copied-session-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: copied-session-results/
          retention-days: 14
          if-no-files-found: error
