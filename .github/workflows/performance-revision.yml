name: Performance revision verification

on:
  push:
    branches: [agent/immutable-performance-proof]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: performance-revision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run test
      - run: node proofs/node-worker.mjs && bun proofs/allocation.ts
      - name: Preserve tested source
        if: always()
        run: |
          git rev-parse HEAD > source-commit.txt
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.proof-tools -czf /tmp/zerocopy-tested-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerocopy-tested-source
          path: /tmp/zerocopy-tested-source.tar.gz
          retention-days: 7
