name: Performance revision verification

on:
  push:
    branches: [agent/immutable-performance-proof]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: performance-revision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run test
      - name: Shared worker, live-data compaction, and allocation checks
        run: |
          mkdir -p proofs/results
          node proofs/node-worker.mjs > proofs/results/revision-ci-worker.json
          bun proofs/revision-memory.ts > proofs/results/revision-ci-memory.json
          bun proofs/allocation.ts > proofs/results/revision-ci-allocation.json
      - uses: actions/checkout@v4
        with:
          ref: 7aea44447177d37a303ab5c1b26d7c5e00e1c1f7
          path: .revision-baseline
      - uses: actions/checkout@v4
        with:
          ref: 59bd5ad9f84358f828968910c66b9a2e80c0673d
          path: .revision-previous
      - name: Four-way comparison and complete write-read workloads
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" .revision-baseline/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" .revision-previous/node_modules
          node proofs/run-revision.mjs .revision-baseline .revision-previous proofs/results/revision-ci.json
          node proofs/run-extended.mjs .revision-baseline .revision-previous proofs/results/revision-ci-extended.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-performance-evidence
          path: |
            proofs/results/revision-ci*.json
            proofs/results/revision-ci*.partial
          retention-days: 30
      - name: Preserve tested source
        if: always()
        run: |
          git rev-parse HEAD > source-commit.txt
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.proof-tools --exclude=.revision-baseline --exclude=.revision-previous -czf /tmp/zerocopy-tested-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zerocopy-tested-source
          path: /tmp/zerocopy-tested-source.tar.gz
          retention-days: 7
