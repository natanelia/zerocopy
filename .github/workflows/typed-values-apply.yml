name: Apply tested typed JSON Redux integration
on:
  push:
    branches: [agent/typed-json-values]
    paths: ['.github/workflows/typed-values-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified Redux integration patch
        shell: bash
        env:
          PATCH: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, gzip, hashlib, pathlib
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == '2dac97c48d73e34e9187025eba1cc0e3f2ca883bf938a0e68b290ca97de7b595'
          pathlib.Path('/tmp/typed-redux.patch').write_bytes(patch)
          PY
          git apply --check /tmp/typed-redux.patch
          git apply /tmp/typed-redux.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redux-codec.ts tsconfig.redux.json type-tests/typed-redux.ts typed-json-redux.test.ts
          git commit -m 'fix: preserve typed JSON values through Redux persistence'
          git push origin HEAD:refs/heads/agent/typed-json-values
