name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Run one diagnostic family
        type: choice
        required: true
        default: compatibility
        options: [compatibility, json, utf8, numeric, geometry, spatial, memory]
      architecture:
        description: Runner architecture
        type: choice
        required: true
        default: x64
        options: [x64, arm64]
      node_version:
        description: Node version
        type: choice
        required: true
        default: '22'
        options: ['22', '24']
      browsers:
        description: Include this suite's browser checks sequentially (x64 only; unavailable for memory)
        type: boolean
        default: false
      baseline_ref:
        description: JSON/UTF-8 baseline branch, tag, or commit (blank means main)
        type: string
        default: main

permissions:
  contents: read

concurrency:
  # Manual investigations share one runner slot, including across branches.
  group: zerocopy-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: ${{ inputs.suite }} (${{ inputs.architecture }}, Node ${{ inputs.node_version }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      DIAGNOSTIC_SUITE: ${{ inputs.suite }}
      DIAGNOSTIC_ARCHITECTURE: ${{ inputs.architecture }}
      DIAGNOSTIC_NODE_VERSION: ${{ inputs.node_version }}
      DIAGNOSTIC_BROWSERS: ${{ inputs.browsers }}
      DIAGNOSTIC_BASELINE_REF: ${{ inputs.baseline_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Validate the selected diagnostic
        run: node scripts/ci/diagnostics.mjs --validate
      - name: Install pinned Rust compiler and WASM target
        uses: ./.github/actions/setup-rust
      - run: bun install
      - name: Build the candidate once
        run: bun run build:wasm && bun run build:browser && bun run build:types
      - name: Run the selected suite sequentially
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/zerocopy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/ci/diagnostics.mjs
      - name: Retain results, partial measurements, and exact run metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.suite }}-${{ inputs.architecture }}-node${{ inputs.node_version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zerocopy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 30
          if-no-files-found: warn
