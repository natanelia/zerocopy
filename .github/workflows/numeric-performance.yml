name: Numeric performance proof
on:
  push:
    branches: [agent/perf-numeric-range]
  pull_request:
    paths: ['numeric*', 'proofs/numeric*', 'type-tests/numeric*', 'tsconfig.numeric.json', 'scripts/build-wasm.mjs', 'scripts/build-browser.ts', '.github/workflows/numeric-performance.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run typecheck:redux && bun run typecheck:values
      - run: bunx tsc --noEmit -p tsconfig.numeric.json
      - run: bun run test
      - run: node proofs/numeric-worker.mjs
      - run: PERF_GATE=1 node proofs/numeric-benchmark.mjs
      - run: PERF_GATE=1 bun proofs/numeric-benchmark.mjs
      - name: Check out the exact transport baseline
        if: runner.arch == 'X64'
        uses: actions/checkout@v4
        with:
          ref: 75e3626ccc6400d1ae195aefdd3526906622009e
          path: .numeric-baseline
          persist-credentials: false
      - name: Build the unmodified transport baseline
        if: runner.arch == 'X64'
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" .numeric-baseline/node_modules
          cd .numeric-baseline
          bun run build:wasm
          bun run build:browser
      - name: Install browser engines
        if: runner.arch == 'X64'
        run: bunx playwright install --with-deps chromium firefox webkit > /tmp/numeric-browser-install.log 2>&1 || { cat /tmp/numeric-browser-install.log; exit 1; }
      - name: Verify browser kernels and compare transport against pinned main
        if: runner.arch == 'X64'
        run: node proofs/numeric-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-proof-${{ runner.arch }}
          path: proofs/results/numeric-*.json
          if-no-files-found: error
          retention-days: 30
