name: Allocation failure safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Bounded-memory snapshots (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm
      - name: Check allocation failure and retained snapshots
        shell: bash
        run: node node_modules/vitest/vitest.mjs run allocation-failure.test.ts 2>&1 | tee allocation-safety.log
      - name: Preserve test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allocation-safety-node-${{ matrix.node }}-${{ github.sha }}
          path: allocation-safety.log
          if-no-files-found: warn
          retention-days: 7
