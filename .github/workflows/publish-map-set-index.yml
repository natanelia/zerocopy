name: Validate and publish map set index

on:
  push:
    branches: [agent/immutable-performance-proof]
    paths:
      - '.github/patches/map-set-index.patch'
      - '.github/workflows/publish-map-set-index.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply the exact locally tested runtime change
        shell: bash
        run: |
          set -euo pipefail
          echo '267740c263ececbd248961b449162e4ec8ed2dcc9f01885fbf8f127ef12b77c8  .github/patches/map-set-index.patch' | sha256sum --check
          git apply --check --index .github/patches/map-set-index.patch
          git apply --index .github/patches/map-set-index.patch
          test "$(git diff --cached --name-only)" = persistent-core.as.ts
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run typecheck:redux
      - name: Unit tests
        run: |
          mkdir -p proofs/results/map-set-ci
          set -o pipefail
          bun run test 2>&1 | tee proofs/results/map-set-ci/unit-tests.log
      - name: Real Node worker
        run: node proofs/node-worker.mjs > proofs/results/map-set-ci/node-worker.json
      - run: bunx playwright install --with-deps chromium
      - name: Real browser tests
        run: |
          set -o pipefail
          bun run test:browser 2>&1 | tee proofs/results/map-set-ci/browser-tests.log
      - uses: actions/checkout@v4
        with:
          ref: 493f3449cf16b0c6084ad61625dfae2650a2f8e3
          path: .map-set-reference
          persist-credentials: false
      - name: Matched baseline and identical-payload comparison
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$PWD/node_modules" .map-set-reference/node_modules
          cp proofs/map-set.ts .map-set-reference/proofs/map-set.ts
          (cd .map-set-reference && node scripts/build-wasm.mjs)
          node proofs/run-map-set.mjs proofs/results/map-set-ci/paired.json .map-set-reference
      - name: Original three-library tables and retained memory
        run: bash proofs/run-hot-path-evidence.sh
      - name: Publish validated runtime without overwriting concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --cached --name-only)" = persistent-core.as.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: accelerate scalar map writes with a bounded prefix index'
          git push origin HEAD:refs/heads/agent/immutable-performance-proof
          git rev-parse HEAD > proofs/results/map-set-ci/published-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-set-index-evidence
          path: |
            proofs/results/map-set-ci/
            proofs/results/hot-path/
            proofs/results/cold-build/
          retention-days: 90
