name: Empty-prefix fixed read screen

on:
  push:
    branches: [proof/empty-prefix-read-screen-20261015]

permissions:
  contents: read

concurrency:
  group: empty-prefix-read-screen-20261015
  cancel-in-progress: false

jobs:
  screen:
    if: github.repository == 'natanelia/zerocopy' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read the exact released proof commit
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          fetch-tags: false
          persist-credentials: false
      - name: Install the pinned official Node release
        timeout-minutes: 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          check-latest: false
      - name: Prepare exact roots and execution pins
        timeout-minutes: 16
        env:
          PREFIX_PROVISION_ROOT: ${{ runner.temp }}/empty-prefix-provisioned
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 proofs/empty-prefix-screen/provision.py "$PREFIX_PROVISION_ROOT"
      - name: Run the released fixed 400-child cohort
        timeout-minutes: 11
        env:
          PREFIX_EXECUTION_PINS: ${{ runner.temp }}/empty-prefix-provisioned/EXECUTION-PINS.json
          PREFIX_SCREEN_OUTPUT: ${{ runner.temp }}/empty-prefix-screen-result
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 proofs/empty-prefix-screen/hosted-adapter.py
      - name: Preserve complete and partial evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: empty-prefix-read-screen-${{ github.sha }}
          path: |
            ${{ runner.temp }}/empty-prefix-provisioned/artifact/
            ${{ runner.temp }}/empty-prefix-screen-result/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
