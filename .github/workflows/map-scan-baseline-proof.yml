name: Exact PR 100 JSON view qualification (proof only)
on:
  push:
    branches: [proof/map-scan-baseline-20261127]
    paths: ['.github/workflows/map-scan-baseline-proof.yml', 'proofs/map-scan-projection-*-20261127.mjs']
permissions:
  contents: read
jobs:
  projection:
    strategy:
      fail-fast: false
      matrix:
        engine: [node, chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: '84ad23a76ee197f45cbc7316017f28b5bbe93d6c'
      CANDIDATE_SHA: '172839f20b24392d96ba21723fd300efa2e5ee8b'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - name: Build exact independently checked out commits
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/projection"
          bun install --frozen-lockfile
          for label in base direct; do
            if [ "$label" = base ]; then sha="$BASE_SHA"; else sha="$CANDIDATE_SHA"; fi
            src="$RUNNER_TEMP/source-$label"
            dst="$RUNNER_TEMP/view-$label"
            git worktree add --detach "$src" "$sha"
            (
              cd "$src"
              test "$(git rev-parse HEAD)" = "$sha"
              export GITHUB_SHA="$sha"
              bun install --frozen-lockfile
              bun run build:wasm
              bun run build:browser
              mkdir -p "$dst"
              cp -r dist/. "$dst/"
              printf '{"type":"module"}\n' > "$dst/package.json"
              printf '%s\n' "$sha" > "$RUNNER_TEMP/projection/$label.sha"
              sha256sum "$dst/shared.js" persistent-core.wasm > "$RUNNER_TEMP/projection/$label.build.sha256"
              if [ "$label" = direct ]; then
                bun run typecheck
                bun --bun node_modules/vitest/vitest.mjs run map-json-values-view.test.ts
                node --test proofs/map-values-view/worker.mjs
              fi
            )
          done
          if cmp -s "$RUNNER_TEMP/view-base/shared.js" "$RUNNER_TEMP/view-direct/shared.js"; then exit 1; fi
          git rev-parse HEAD > "$RUNNER_TEMP/projection/proof-head.txt"
          node --version > "$RUNNER_TEMP/projection/node-version.txt"
          bun --version > "$RUNNER_TEMP/projection/bun-version.txt"
      - name: Install selected browser
        if: matrix.engine != 'node'
        run: bunx playwright install --with-deps ${{ matrix.engine }}
      - name: Qualify exact candidate with independent baseline and A/A controls
        run: |
          set -euo pipefail
          if [ "${{ matrix.engine }}" = node ]; then
            node proofs/map-scan-projection-paired-20261127.mjs 100000 nested "$RUNNER_TEMP/view-base/shared.js" "$RUNNER_TEMP/view-direct/shared.js" "$RUNNER_TEMP/projection" | tee "$RUNNER_TEMP/projection/run.log"
          else
            node proofs/map-scan-projection-browser-20261127.mjs ${{ matrix.engine }} 100000 "$RUNNER_TEMP/view-base" "$RUNNER_TEMP/view-direct" "$RUNNER_TEMP/projection" | tee "$RUNNER_TEMP/projection/run.log"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pr100-exact-${{ matrix.engine }}-${{ github.run_id }}
          path: ${{ runner.temp }}/projection/
          retention-days: 14
