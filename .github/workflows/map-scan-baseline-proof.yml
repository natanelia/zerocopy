name: Worker full-scan JSON projection baseline (proof only)
on:
  push:
    branches: [proof/map-scan-baseline-20261127]
    paths: ['.github/workflows/map-scan-baseline-proof.yml', 'proofs/map-scan-projection-*-20261127.mjs']
permissions:
  contents: read
jobs:
  projection:
    strategy:
      fail-fast: false
      matrix:
        count: [1000, 10000, 100000]
        shape: [flat, nested]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - name: Build unchanged pinned runtime
        run: |
          set -euo pipefail
          git diff --exit-code 84ad23a76ee197f45cbc7316017f28b5bbe93d6c HEAD -- '*.ts' '*.rs' 'package.json' 'bun.lock'
          bun install --frozen-lockfile
          bun run build:wasm
          bun run build:browser
          mkdir -p "$RUNNER_TEMP/projection"
          sha256sum dist/shared.js persistent-core.wasm > "$RUNNER_TEMP/projection/build.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/projection/proof-head.txt"
          node --version > "$RUNNER_TEMP/projection/node-version.txt"
      - name: Compare existing full object and selective view scans
        run: |
          set -euo pipefail
          node proofs/map-scan-projection-paired-20261127.mjs ${{ matrix.count }} ${{ matrix.shape }} "$PWD/dist/shared.js" "$RUNNER_TEMP/projection" | tee "$RUNNER_TEMP/projection/run.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: projection-${{ matrix.count }}-${{ matrix.shape }}-${{ github.run_id }}
          path: ${{ runner.temp }}/projection/
          retention-days: 14
