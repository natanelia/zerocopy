name: Worker map scan cache sensitivity (proof only)
on:
  push:
    branches: [proof/map-scan-baseline-20261127]
    paths: ['.github/workflows/map-scan-baseline-proof.yml', 'proofs/map-scan-cache-*-20261127.mjs']
permissions:
  contents: read
jobs:
  sensitivity:
    strategy:
      fail-fast: false
      matrix:
        count: [1000, 10000, 100000]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - name: Build pinned baseline and temporary cache-limit probes
        run: |
          set -euo pipefail
          git diff --exit-code 84ad23a76ee197f45cbc7316017f28b5bbe93d6c HEAD -- '*.ts' '*.rs' 'package.json' 'bun.lock'
          bun install --frozen-lockfile
          bun run build:wasm
          out="$RUNNER_TEMP/cache-builds"
          evidence="$RUNNER_TEMP/map-scan-cache"
          mkdir -p "$out" "$evidence"
          cp arena.ts "$RUNNER_TEMP/arena.base.ts"
          trap 'cp "$RUNNER_TEMP/arena.base.ts" arena.ts' EXIT
          for mode in base mid high; do
            cp "$RUNNER_TEMP/arena.base.ts" arena.ts
            case "$mode" in
              base) ;;
              mid) sed -i 's/const MAX_DECODED_RECORDS = 2048;/const MAX_DECODED_RECORDS = 16384;/' arena.ts ;;
              high)
                sed -i 's/const MAX_DECODED_RECORDS = 2048;/const MAX_DECODED_RECORDS = 100000;/' arena.ts
                sed -i 's/const MAX_DECODED_BYTES = 2 \* 1024 \* 1024;/const MAX_DECODED_BYTES = 16 * 1024 * 1024;/' arena.ts ;;
            esac
            grep '^const MAX_DECODED_' arena.ts | tee "$evidence/$mode-limits.txt"
            case "$mode" in
              base) grep -Fx 'const MAX_DECODED_RECORDS = 2048;' arena.ts ;;
              mid) grep -Fx 'const MAX_DECODED_RECORDS = 16384;' arena.ts ;;
              high) grep -Fx 'const MAX_DECODED_RECORDS = 100000;' arena.ts; grep -Fx 'const MAX_DECODED_BYTES = 16 * 1024 * 1024;' arena.ts ;;
            esac
            sha256sum arena.ts persistent-core.wasm > "$evidence/$mode-source.sha256"
            git diff -- arena.ts > "$evidence/$mode.patch"
            bun run build:browser
            mkdir -p "$out/$mode"
            cp -r dist/. "$out/$mode/"
            printf '{"type":"module"}\n' > "$out/$mode/package.json"
            (cd "$out/$mode"; find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$evidence/$mode-build.sha256"
          done
          cp "$RUNNER_TEMP/arena.base.ts" arena.ts
          git diff --exit-code -- arena.ts
          git rev-parse HEAD > "$evidence/proof-head.txt"
          node --version > "$evidence/node-version.txt"
          bun --version > "$evidence/bun-version.txt"
      - name: Run balanced paired fresh-process worker scans
        run: |
          set -euo pipefail
          node proofs/map-scan-cache-paired-20261127.mjs ${{ matrix.count }} "$RUNNER_TEMP/cache-builds" "$RUNNER_TEMP/map-scan-cache" | tee "$RUNNER_TEMP/map-scan-cache/run.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: map-scan-cache-${{ matrix.count }}-${{ github.run_id }}
          path: ${{ runner.temp }}/map-scan-cache/
          retention-days: 14
