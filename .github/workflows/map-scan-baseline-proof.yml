name: Worker map scan attribution (proof only)
on:
  push:
    branches: [proof/map-scan-baseline-20261127]
    paths: ['.github/workflows/map-scan-baseline-proof.yml', 'proofs/map-scan-baseline-20261127.mjs']
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        count: [10000, 100000]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - name: Build baseline
        run: |
          bun install --frozen-lockfile
          bun run build:wasm && bun run build:browser
          git diff --exit-code 84ad23a76ee197f45cbc7316017f28b5bbe93d6c HEAD -- '*.ts' '*.rs' 'package.json' 'bun.lock'
      - name: Profile actual two-reader scans (diagnostic, not latency evidence)
        env:
          ZEROCOPY_SCAN_PROFILE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/map-scan"
          node proofs/map-scan-baseline-20261127.mjs ${{ matrix.count }} 3 "$RUNNER_TEMP/map-scan/results.json" | tee "$RUNNER_TEMP/map-scan/results.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: map-scan-profile-${{ matrix.count }}-${{ github.run_id }}
          path: ${{ runner.temp }}/map-scan/
          retention-days: 14
