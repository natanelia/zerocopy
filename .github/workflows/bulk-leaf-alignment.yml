name: Primitive bulk-leaf alignment

on:
  push:
    branches: [perf/compact-bulk-leaves-20261008]
  pull_request:
    branches: [main]
    paths:
      - 'arena.ts'
      - 'persistent-core.as.ts'
      - 'bulk-leaf-alignment.test.ts'
      - 'proofs/*bulk-leaf*'
      - 'scripts/build-*'
      - 'package.json'
      - '.github/workflows/bulk-leaf-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'perf/compact-bulk-leaves-20261008'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run typecheck:values && bun run typecheck:redux
      - name: Build the merge-base with identical dependencies and flags
        run: |
          baseline_ref="$(git merge-base HEAD origin/main)"
          git cat-file -e "$baseline_ref^{commit}"
          mkdir -p "$RUNNER_TEMP/bulk-leaf-baseline" bulk-leaf-ci
          printf '%s\n' "$baseline_ref" > bulk-leaf-ci/baseline-commit.txt
          git rev-parse HEAD > bulk-leaf-ci/candidate-commit.txt
          git rev-parse origin/main > bulk-leaf-ci/observed-main-commit.txt
          node proofs/check-core-diagnostic-source.mjs "$baseline_ref" bulk > bulk-leaf-ci/source-guard.json
          git archive "$baseline_ref" | tar -x -C "$RUNNER_TEMP/bulk-leaf-baseline"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/bulk-leaf-baseline/node_modules"
          (cd "$RUNNER_TEMP/bulk-leaf-baseline" && bun run build:wasm && bun run build:browser)
      - name: Verify compact leaves and immutable collection invariants
        run: bun run test bulk-leaf-alignment.test.ts map-memory.test.ts map-set-path.test.ts performance-revision.test.ts descriptor-validation.test.ts freeze-json.test.ts json-read-cache.test.ts --maxWorkers=1 --fileParallelism=false --testTimeout=30000
      - name: Check deterministic allocation in both runtimes
        run: |
          node proofs/bulk-leaf-allocation.mjs "$RUNNER_TEMP/bulk-leaf-baseline" . > bulk-leaf-ci/allocation-node.json
          bun proofs/bulk-leaf-allocation.mjs "$RUNNER_TEMP/bulk-leaf-baseline" . > bulk-leaf-ci/allocation-bun.json
      - name: Verify old and new producers/readers with real workers
        run: node proofs/bulk-leaf-worker.mjs "$RUNNER_TEMP/bulk-leaf-baseline" . > bulk-leaf-ci/workers.json
      - name: Measure isolated Node and Bun throughput with unchanged controls
        run: node proofs/run-bulk-leaf-performance.mjs "$RUNNER_TEMP/bulk-leaf-baseline" . bulk-leaf-ci/throughput
      - name: Preserve source and every measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bulk-leaf-alignment-${{ runner.arch }}-${{ github.sha }}
          path: bulk-leaf-ci/
          retention-days: 30
          if-no-files-found: error
