name: Bulk input fixed latency study

on:
  push:
    branches: [proof/bulk-input-latency-20261009]

permissions:
  contents: read
  actions: read

jobs:
  latency:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/proof/bulk-input-latency-20261009' &&
      github.event.before == '52d5fb012eb1f568e11807b7cb2a66c4566589e2' &&
      !github.event.forced && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 2
        with:
          bun-version: '1.4.2'
      - name: Download and bind exact audited inputs
        id: prepare
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: node proofs/bulk-input-latency/hosted.mjs prepare
      - name: Run all 80 fixed subjects once
        id: measure
        timeout-minutes: 47
        run: node proofs/bulk-input-latency/hosted.mjs run '${{ steps.prepare.outputs.frozen }}'
      - name: Retain exact terminal and incomplete status
        if: always()
        timeout-minutes: 2
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: node proofs/bulk-input-latency/hosted.mjs finalize
      - name: Package original evidence without filename restrictions
        if: always()
        timeout-minutes: 3
        run: python3 proofs/bulk-input-latency/package.py "$RUNNER_TEMP/bulk-input-latency" "$RUNNER_TEMP/bulk-input-latency.tar.gz"
      - name: Upload original study evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: bulk-input-latency-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bulk-input-latency.tar.gz
            ${{ runner.temp }}/bulk-input-latency.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
