name: Empty-recipient publication-latency screen

on:
  push:
    branches: [proof/empty-recipient-screen-20261015]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    if: github.ref == 'refs/heads/proof/empty-recipient-screen-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify inert harness and workflow context
        run: |
          node --test proofs/empty-recipient/harness.node.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 proofs/empty-recipient/harness_test.py
      - name: Provision the pinned shared dependencies once
        env:
          BASELINE_DIRECTORY: ${{ runner.temp }}/empty-recipient-baseline
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/empty-recipient-evidence
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(node --version)" = v22.16.0
          test "$(bun --version)" = 1.4.2
          npm ci --prefix proofs/empty-recipient/dependencies --no-audit --no-fund
          git worktree add --detach "$BASELINE_DIRECTORY" afdffdcfcbd61013f120de82411c0c4a6b2d1e0e
          ln -s "$GITHUB_WORKSPACE/proofs/empty-recipient/dependencies/node_modules" node_modules
          ln -s "$GITHUB_WORKSPACE/proofs/empty-recipient/dependencies/node_modules" "$BASELINE_DIRECTORY/node_modules"
      - name: Admit exact sources and run the fixed latency screen
        env:
          BASELINE_DIRECTORY: ${{ runner.temp }}/empty-recipient-baseline
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/empty-recipient-evidence
          CI: '1'
          NO_COLOR: '1'
        run: python3 proofs/empty-recipient/run.py "$GITHUB_WORKSPACE" "$BASELINE_DIRECTORY" "$EVIDENCE_DIRECTORY"
      - name: Preserve partial or complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-recipient-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/empty-recipient-evidence/
            proofs/empty-recipient/*.mjs
            proofs/empty-recipient/*.py
            proofs/empty-recipient/*.md
            proofs/empty-recipient/*.json
            proofs/empty-recipient/dependencies/package*.json
            dist/
            *.wasm
            ${{ runner.temp }}/empty-recipient-baseline/dist/
            ${{ runner.temp }}/empty-recipient-baseline/*.wasm
            worker.ts
            worker-protocol.ts
            shared.ts
            worker.test.ts
            worker-empty-recipient.test.ts
            .github/workflows/empty-recipient.yml
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
