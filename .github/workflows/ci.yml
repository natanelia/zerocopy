name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Only superseded PR revisions cancel each other; keep standalone evidence runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned Rust compiler and WASM target
        uses: ./.github/actions/setup-rust
      - run: bun install
      - run: bun run build:wasm
      - name: Verify Rust WASM build rejection guards
        run: node --test scripts/rust-wasm.node.mjs
      - name: Verify aligned and unaligned geometry reads
        run: node proofs/rust-migration-20261115/geometry-abi.mjs
      - run: bun run build:browser && bun run build:types
      - name: Verify Rust kernels with real workers
        run: node proofs/rust-migration-20261115/workers.mjs
      - run: bun run typecheck
      - run: bun run typecheck:redux
      - run: bun run typecheck:values
      - run: bun run typecheck:geometry
      - name: Check public worker task declarations
        run: bunx tsc --noEmit -p tsconfig.worker.json
      - name: Check optional numeric and text-search declarations
        run: |
          bunx tsc --noEmit -p tsconfig.numeric.json
          bunx tsc --noEmit -p tsconfig.text-search.json
      - name: Check diagnostic selection and evidence safeguards
        run: node --test scripts/ci/diagnostics.node.mjs
      - name: Run unit and integration tests
        shell: bash
        run: bun run test 2>&1 | tee vitest.log
      - name: Verify task lifecycle with real Node workers
        shell: bash
        run: node --test --test-concurrency=1 --test-timeout=15000 proofs/worker-tasks.mjs proofs/worker-task-lifecycle.node.mjs 2>&1 | tee worker-tasks.log
      - name: Verify list queries and bounded string reuse
        run: node --test proofs/list-query.mjs
      - name: Verify additional list pipeline regressions
        run: node --test proofs/list-query-regression.mjs
      - name: Verify lazy memory allocation
        run: node --test proofs/memory-startup.mjs
      - name: Check documentation links and recorded data
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/check-docs.node.mjs
          if [ -n "$DOCS_BASE" ]; then
            # Preservation compares two trees; it does not need the full history.
            git fetch --no-tags --depth=1 origin "$DOCS_BASE"
            node scripts/check-docs.mjs --base "$DOCS_BASE" --preserve
          else
            node scripts/check-docs.mjs
          fi
      - name: Check examples from Markdown
        run: node scripts/check-doc-examples.mjs
      - name: Check distinct native and worker regressions
        shell: bash
        env:
          CI_REGRESSION_ARTIFACTS: proofs/results/ci-regressions
        run: node scripts/ci/check-regressions.mjs native 2>&1 | tee native-regressions.log
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run all real Chromium integration tests
        shell: bash
        run: bun run test:browser 2>&1 | tee browser.log
      - name: Check checkpoint, heap, and batched-list browser workers
        shell: bash
        env:
          CI_REGRESSION_ARTIFACTS: proofs/results/ci-regressions
        run: node scripts/ci/check-regressions.mjs browser 2>&1 | tee browser-regressions.log
      - name: Check documented browser workers and isolation guards
        run: node scripts/check-doc-browser.mjs
      - name: Check typed task examples from Markdown
        shell: bash
        run: node scripts/check-worker-docs.mjs 2>&1 | tee worker-docs.log
      - name: Verify ordered-map projections and saved evidence
        run: |
          node proofs/ordered-map-projections-20261105/worker.mjs
          node proofs/ordered-map-projections-20261105/verify.mjs proofs/ordered-map-projections-20261105/results/pilot-v1.json.gz proofs/ordered-map-projections-20261105/results/pilot-v2.json.gz proofs/ordered-map-projections-20261105/results/formal-v2.json.gz
      - name: Check built Node entry points
        run: |
          node proofs/node-worker.mjs
          node proofs/worker-sessions.mjs
          node proofs/redux-node.mjs
          node proofs/typed-json-worker.mjs
          node --test proofs/map-values-view/worker.mjs
          node proofs/sorted-foreach-20261105/worker.mjs
          node proofs/sorted-foreach-20261105/verify.mjs
      - name: Check the installed npm tarball
        run: bun run check:package
      - name: Verify historical evidence
        run: node proofs/restore-local-evidence.mjs
      - name: Pack the validated release archive
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
      - name: Retain the validated npm package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package/*.tgz
          retention-days: 7
          if-no-files-found: error
      - name: Archive tested source
        if: ${{ !cancelled() }}
        run: git archive --format=tar HEAD > tested-source.tar
      - name: Retain test evidence and portable build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            vitest.log
            browser.log
            native-regressions.log
            browser-regressions.log
            proofs/results/ci-regressions/
            worker-tasks.log
            worker-docs.log
            dist/
            package.json
            tested-source.tar
          retention-days: 7
