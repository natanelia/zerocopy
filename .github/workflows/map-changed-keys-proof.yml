name: Map diff existing-path controls (no deploy)
on:
  push:
    branches: ['proof/map-diff-phase-20261125']
permissions:
  contents: read
concurrency:
  group: map-diff-phase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    if: github.ref == 'refs/heads/proof/map-diff-phase-20261125'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 76ab6b53aa0d3b40202720ca12d9fcc904716cf2
          path: _baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3807c15a1a1b4958aec407a79a8238067988877f
          path: _candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - name: Build both pinned sources
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/map-changed-keys"
          mkdir -p "$out"
          test "$(git -C _baseline rev-parse HEAD)" = "76ab6b53aa0d3b40202720ca12d9fcc904716cf2"
          test "$(git -C _candidate rev-parse HEAD)" = "3807c15a1a1b4958aec407a79a8238067988877f"
          cmp _candidate/package.json _baseline/package.json
          bun install
          {
            echo "baseline=$(git -C _baseline rev-parse HEAD)"
            echo "candidate=$(git -C _candidate rev-parse HEAD)"
            node --version
            bun --version
            rustc --version
            uname -a
            lscpu
            sha256sum proofs/map-diff-existing-path-20261125.mjs proofs/map-lifecycle.mjs proofs/map-lifecycle-workload.mjs
            if [ -f bun.lock ]; then sha256sum bun.lock; fi
          } > "$out/environment.txt"
          if [ -f bun.lock ]; then cp bun.lock "$out/"; fi
          for build in _baseline _candidate; do
            ln -s "$GITHUB_WORKSPACE/node_modules" "$build/node_modules"
            (
              cd "$build"
              bun run build:wasm
              bun run build:browser
              npm --prefix website install --ignore-scripts --no-package-lock
              SITE_COMMIT="$(git rev-parse HEAD)" node website/build.mjs
              sha256sum dist/*.js *.wasm website/node_modules/marked/lib/marked.esm.js
            ) 2>&1 | tee "$out/$build.log"
          done
          cmp _baseline/website/node_modules/marked/lib/marked.esm.js _candidate/website/node_modules/marked/lib/marked.esm.js
      - name: Focused runtime correctness
        run: cd _candidate && bun run typecheck && bun run test map-changed-keys.test.ts
      - name: Install browsers
        run: bunx playwright install --with-deps ${{ matrix.engine }}
      - name: Unchanged website catalog controls (no diff calls)
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER=${{ matrix.engine }}
          out="$RUNNER_TEMP/map-changed-keys"
          for count in 10000 100000; do
            timeout --signal=TERM --kill-after=15s 900s node proofs/map-diff-existing-path-20261125.mjs _baseline _candidate "$out/catalog-$count.json" "$count" 12 full-shared-get,selective-shared-get,selective-shared-view
          done
      - name: Existing map iteration and lifecycle controls (Node and Bun)
        if: ${{ matrix.engine == 'chromium' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/map-changed-keys"
          for runtime in node bun; do
            timeout --signal=TERM --kill-after=15s 240s "$runtime" proofs/map-lifecycle.mjs _baseline _baseline "$out/lifecycle-$runtime-aa.json" 7
            timeout --signal=TERM --kill-after=15s 240s "$runtime" proofs/map-lifecycle.mjs _baseline _candidate "$out/lifecycle-$runtime-ab.json" 7
          done
      - name: Retain raw proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: map-diff-existing-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/map-changed-keys/
          retention-days: 30
          if-no-files-found: warn
