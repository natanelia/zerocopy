name: Persistent schema packed ingestion and predicate control (proof only)
on:
  push:
    branches: [proof/persistent-columnar-table-20261127]
    paths: ['proofs/persistent-columnar-table-20261127/**', '.github/workflows/persistent-columnar-table-proof.yml']
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
        size: [4096, 16384]
        retention: [2]
        pattern: [spread]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '172839f20b24392d96ba21723fd300efa2e5ee8b'
          path: .pr100-control
          persist-credentials: false
      - name: Install pinned direct JSON control in ephemeral build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .pr100-control rev-parse HEAD)" = 172839f20b24392d96ba21723fd300efa2e5ee8b
          cp .pr100-control/shared-map.ts shared-map.ts
          rm -rf .pr100-control
          sha256sum shared-map.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - run: bun install --frozen-lockfile
      - run: bun run build:wasm && bun run build:browser
      - run: bunx playwright install --with-deps ${{ matrix.engine }}
      - name: Dynamic schema and generation semantics
        run: node --test proofs/persistent-columnar-table-20261127/schema.test.mjs
      - name: Browser schema replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p columnar-results
          git rev-parse HEAD | tee columnar-results/commit.txt
          sha256sum shared-map.ts proofs/persistent-columnar-table-20261127/*.mjs dist/*.js > columnar-results/hashes.txt
          node proofs/persistent-columnar-table-20261127/dynamic-browser.mjs columnar-results/results.json ${{ matrix.engine }} ${{ matrix.size }} 6 48 ${{ matrix.retention }} ${{ matrix.pattern }} | tee columnar-results/raw.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: columnar-schema-packed-${{ matrix.engine }}-${{ matrix.size }}-${{ matrix.pattern }}-hold${{ matrix.retention }}-${{ github.run_id }}
          path: columnar-results/
          retention-days: 30
          if-no-files-found: warn
