name: Scalar spatial bulk proof
on:
  push:
    branches: [agent/perf-spatial-bulk]
  pull_request:
    paths: ['numeric-spatial*', 'proofs/spatial*', 'type-tests/numeric-spatial*', '.github/workflows/spatial-bulk-performance.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bunx tsc --noEmit -p tsconfig.numeric.json
      - run: bun run test
      - run: node proofs/spatial-worker.mjs && node proofs/numeric-worker.mjs
      - run: PERF_GATE=1 node proofs/spatial-bulk-benchmark.mjs
      - run: PERF_GATE=1 bun proofs/spatial-bulk-benchmark.mjs
      - run: PERF_GATE=1 node proofs/numeric-benchmark.mjs
      - name: Install browser engines
        if: runner.arch == 'X64'
        run: bunx playwright install --with-deps chromium firefox webkit > /tmp/spatial-browser-install.log 2>&1 || { cat /tmp/spatial-browser-install.log; exit 1; }
      - name: Verify spatial kernels and read-only attachments in browsers
        if: runner.arch == 'X64'
        run: node proofs/spatial-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-bulk-proof-${{ runner.arch }}
          path: proofs/results/spatial-*.json
          if-no-files-found: error
          retention-days: 30
