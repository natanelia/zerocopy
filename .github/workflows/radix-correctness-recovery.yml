name: Radix correctness-only recovery

on:
  push:
    branches: ['proof/radix-correctness-recovery-20261009']

permissions:
  contents: read

concurrency:
  group: radix-correctness-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correctness:
    # One new nonforced branch publication; no dispatch, rerun, or performance step.
    if: github.event_name == 'push' && github.ref == 'refs/heads/proof/radix-correctness-recovery-20261009' && github.run_attempt == 1 && github.event.created && github.event.before == '0000000000000000000000000000000000000000' && !github.event.forced && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize runner-local paths
        run: |
          set -euo pipefail
          {
            printf 'EVIDENCE=%s/radix-correctness-evidence\n' "$RUNNER_TEMP"
            printf 'BASE_ROOT=%s/radix-correctness-baseline\n' "$RUNNER_TEMP"
            printf 'CAND_ROOT=%s/radix-correctness-candidate\n' "$RUNNER_TEMP"
            printf 'UPLOAD_ROOT=%s/radix-correctness-upload\n' "$RUNNER_TEMP"
            printf 'npm_config_cache=%s/radix-correctness-npm-cache\n' "$RUNNER_TEMP"
          } | tee -a "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve source and original failed-study context before setup
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/source" "$EVIDENCE/logs" "$EVIDENCE/builds"
          cp "$GITHUB_EVENT_PATH" "$EVIDENCE/source/push-event.json"
          cp proofs/radix-correctness-history.json "$EVIDENCE/source/"
          cp .github/workflows/radix-correctness-recovery.yml "$EVIDENCE/source/"
          git archive --format=tar HEAD > "$EVIDENCE/source/recovery-source.tar"
          git archive --format=tar aea884493421b1ff067a39e65f0f4b9d4d11e68a > "$EVIDENCE/source/original-failed-gate-source.tar"
          git archive --format=tar 3773c6e519c7c0958da13727ed1082f449f3ee25 > "$EVIDENCE/source/baseline-source.tar"
          git archive --format=tar c79c803bf7c59a2fc559e43ce7cc74aa4dacde15 > "$EVIDENCE/source/candidate-source.tar"
          git show 47402ad2ec2ac7226831a577e6e224c555710af8:arena.ts > "$EVIDENCE/source/held-combined-arena.ts"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Freeze the exact correctness command plan and invocation
        run: node proofs/radix-correctness-recovery.mjs initialize "$EVIDENCE" "$BASE_ROOT" "$CAND_ROOT"
      - name: Set up independently pinned runtime worktrees
        timeout-minutes: 10
        run: node proofs/radix-correctness-recovery.mjs setup "$EVIDENCE" "$BASE_ROOT" "$CAND_ROOT"
      - name: Run both original suites once and the matched baseline semantic overlay
        timeout-minutes: 30
        run: node proofs/radix-correctness-recovery.mjs validate "$EVIDENCE" "$BASE_ROOT" "$CAND_ROOT"
      - name: Seal only complete passing correctness evidence
        run: node proofs/radix-correctness-recovery.mjs seal "$EVIDENCE" "$BASE_ROOT" "$CAND_ROOT"
      - name: Preserve complete or partial builds and context
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/builds" "$EVIDENCE/logs"
          for item in bun.lock bun.lockb; do
            if [ -f "$GITHUB_WORKSPACE/$item" ]; then cp "$GITHUB_WORKSPACE/$item" "$EVIDENCE/source/proof-$item"; fi
          done
          for build in baseline candidate; do
            directory="$BASE_ROOT"
            if [ "$build" = candidate ]; then directory="$CAND_ROOT"; fi
            if [ -d "$directory" ]; then
              mkdir -p "$EVIDENCE/builds/$build"
              for item in dist package.json bun.lock bun.lockb trie-view-capture.test.ts proofs/trie-view-fixtures.ts; do
                if [ -e "$directory/$item" ]; then
                  mkdir -p "$EVIDENCE/builds/$build/$(dirname "$item")"
                  cp -a "$directory/$item" "$EVIDENCE/builds/$build/$item"
                fi
              done
              find "$directory" -maxdepth 1 -type f -name '*.wasm' -exec cp '{}' "$EVIDENCE/builds/$build/" \;
              git -C "$directory" status --short > "$EVIDENCE/logs/$build-final-status.log"
            fi
          done
          git status --short > "$EVIDENCE/logs/proof-final-status.log"
          git rev-parse HEAD > "$EVIDENCE/logs/recovery-commit.log"
      - name: Archive all complete or partial evidence without overwriting
        if: always()
        run: node proofs/trie-view-archive.mjs "$EVIDENCE" "$UPLOAD_ROOT"
      - name: Upload portable correctness-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radix-correctness-recovery-${{ github.sha }}
          path: |
            ${{ env.UPLOAD_ROOT }}/radix-view.tar.gz
            ${{ env.UPLOAD_ROOT }}/radix-view.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
