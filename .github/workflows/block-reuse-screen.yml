# Prepared locally only. One separately reviewed recovery creation push.
name: Block reuse timing recovery attempt 1
on:
  push:
    branches: ['proof/block-reuse-timing-recovery-20261009']
    paths:
      - '.github/workflows/block-reuse-screen.yml'
      - 'proofs/block-reuse-*'
      - 'proofs/block-reuse.bun.lock'
permissions:
  contents: read
concurrency:
  group: block-reuse-timing-recovery-attempt1
  cancel-in-progress: false
jobs:
  screen:
    if: github.event_name == 'push' && github.ref == 'refs/heads/proof/block-reuse-timing-recovery-20261009' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    # Step caps total 91 minutes: 9 tool setup + 5 install + 2 harness +
    # unchanged 65 science + 5 archive + 5 upload. Nine minutes remain unallocated.
    timeout-minutes: 100
    env:
      BLOCK_REUSE_ATTEMPT: '1'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 3
        with:
          bun-version: '1.4.2'
      - name: Verify frozen candidate and install common dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow"
          node proofs/block-reuse-recovery.mjs activation "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow/activation.json"
          cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow/push-event.json"
          test "$(git rev-parse HEAD^)" = '5df600e139666c28d338800a8d5d79270a284af9'
          test "$(git rev-parse 5df600e139666c28d338800a8d5d79270a284af9^{tree})" = '0dde0756fa4a71aa82112b2d0e52b722f12082af'
          test "$(git rev-parse 5df600e139666c28d338800a8d5d79270a284af9^)" = 'ad2a19d65a836985a2364b181bc9bd8dce6e42ad'
          test ! -e node_modules
          test ! -e bun.lock
          cp proofs/block-reuse.bun.lock bun.lock
          bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow/dependencies.log"
          git worktree add --detach "$RUNNER_TEMP/block-reuse-timing-recovery-baseline" ad2a19d65a836985a2364b181bc9bd8dce6e42ad
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/block-reuse-timing-recovery-baseline/node_modules"
      - name: Verify proof protocol without latency
        timeout-minutes: 2
        run: |
          node --test proofs/block-reuse-protocol.node.mjs proofs/block-reuse-recovery.node.mjs > "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow/protocol-node.log" 2>&1
          bun test ./proofs/block-reuse-protocol.node.mjs ./proofs/block-reuse-recovery.node.mjs > "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow/protocol-bun.log" 2>&1
      - name: Gate full prerequisites before all pilots and balanced measurements
        timeout-minutes: 65
        run: node proofs/block-reuse-performance.mjs "$RUNNER_TEMP/block-reuse-timing-recovery-baseline" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/block-reuse-timing-recovery-evidence"
      - name: Preserve complete or partial evidence
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow"
          cp .github/workflows/block-reuse-screen.yml "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow/"
          git status --short > "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow/git-status.txt"
          git log -1 --format=fuller > "$RUNNER_TEMP/block-reuse-timing-recovery-evidence/workflow/commit.txt"
          node proofs/block-reuse-recovery.mjs seal "$RUNNER_TEMP/block-reuse-timing-recovery-evidence"
          tar -czf "$RUNNER_TEMP/block-reuse-timing-recovery-attempt1.tar.gz" -C "$RUNNER_TEMP" block-reuse-timing-recovery-evidence
          cd "$RUNNER_TEMP"
          sha256sum block-reuse-timing-recovery-attempt1.tar.gz > block-reuse-timing-recovery-attempt1.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: block-reuse-timing-recovery-attempt1-x64
          path: |
            ${{ runner.temp }}/block-reuse-timing-recovery-attempt1.tar.gz
            ${{ runner.temp }}/block-reuse-timing-recovery-attempt1.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
