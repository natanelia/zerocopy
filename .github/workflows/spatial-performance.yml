name: Spatial performance experiment
on:
  push:
    branches: [agent/perf-spatial-box]
  pull_request:
    paths: ['numeric-spatial*', 'proofs/spatial*', 'type-tests/numeric-spatial*', '.github/workflows/spatial-performance.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bunx tsc --noEmit -p tsconfig.numeric.json
      - run: bun run test
      - run: PERF_GATE=1 node proofs/spatial-benchmark.mjs
      - run: PERF_GATE=1 bun proofs/spatial-benchmark.mjs
      - run: PERF_GATE=1 node proofs/numeric-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-proof-${{ runner.arch }}
          path: proofs/results/*.json
          if-no-files-found: error
          retention-days: 30
