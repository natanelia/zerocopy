name: Map forEach proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared-map.ts'
      - 'arena.ts'
      - 'map-foreach.test.ts'
      - 'proofs/map-foreach-20261108/**'
      - '.github/workflows/map-foreach.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.2' }
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types && bun run typecheck
      - name: Check traversal and compatibility on Node
        run: node node_modules/vitest/vitest.mjs run map-foreach.test.ts shared-map.test.ts map-values-view.test.ts map-set-index.test.ts map-set-utf8.test.ts --maxWorkers=2
      - name: Check traversal and compatibility on Bun
        run: bun --bun node_modules/vitest/vitest.mjs run map-foreach.test.ts shared-map.test.ts map-values-view.test.ts map-set-index.test.ts map-set-utf8.test.ts --maxWorkers=2
      - name: Verify all saved samples and source identities without retiming
        run: node proofs/map-foreach-20261108/verify.mjs
      - name: Check real shared and copied Node workers during owner growth
        run: |
          mkdir -p .map-foreach-ci
          node proofs/map-foreach-20261108/node-worker.mjs > .map-foreach-ci/node-workers.json
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check real shared and copied Chromium workers during owner growth
        run: node proofs/map-foreach-20261108/browser-check.mjs > .map-foreach-ci/chromium-workers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-foreach-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: .map-foreach-ci/
          retention-days: 30
