name: Baseline checks (incomplete draft)

on:
  push:
    branches: [agent/immutable-performance-proof]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm
      - name: Original runtime tests, not the unintegrated candidate
        run: bun run test
      - name: State the verification scope
        run: echo '::notice::The candidate upload is incomplete. These checks test the original runtime. See IMPLEMENTATION_STATUS.md.'
