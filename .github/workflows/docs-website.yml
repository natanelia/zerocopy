name: Documentation website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: npm --prefix website install --ignore-scripts --no-package-lock
      - run: bunx playwright install --with-deps chromium
      - name: Check root-hosted site
        run: |
          node website/build.mjs
          node --test website/tests/*.test.mjs
          node website/tests/browser.mjs
      - name: Build and check GitHub Pages subpath
        env:
          SITE_BASE: /zerocopy/
          SITE_ORIGIN: https://natanelia.github.io
        run: |
          node website/build.mjs
          node --test website/tests/*.test.mjs
          node website/tests/browser.mjs
      - name: Retain site and visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: zerocopy-website-${{ github.sha }}
          path: |
            website/_site/
            website/artifacts/
          include-hidden-files: true
          retention-days: 14
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
