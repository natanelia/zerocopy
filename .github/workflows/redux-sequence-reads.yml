name: Redux sequence read verification

on:
  pull_request:
    paths:
      - 'arena.ts'
      - 'shared-stack.ts'
      - 'shared-queue.ts'
      - 'shared.ts'
      - 'redux*.ts'
      - '*.as.ts'
      - 'proofs/redux-sequence-reads-20261105/**'
      - 'scripts/build-browser.ts'
      - 'scripts/build-wasm.mjs'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/redux-sequence-reads.yml'
  push:
    branches: [main]
    paths:
      - 'arena.ts'
      - 'shared-stack.ts'
      - 'shared-queue.ts'
      - 'shared.ts'
      - 'redux*.ts'
      - '*.as.ts'
      - 'proofs/redux-sequence-reads-20261105/**'
      - 'scripts/build-browser.ts'
      - 'scripts/build-wasm.mjs'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/redux-sequence-reads.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redux-sequence-reads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install existing project dependencies
        run: bun install
      - name: Build native and portable modules
        run: |
          bun run build:wasm
          bun run build:browser
          bun run build:types
          bun run typecheck
          bun run typecheck:redux
      - name: Run focused regressions in Node and Bun
        shell: bash
        run: |
          mkdir -p proofs/redux-sequence-reads-20261105/ci-logs
          node node_modules/vitest/vitest.mjs run redux-sequence-codec.test.ts --maxWorkers=1 2>&1 | tee proofs/redux-sequence-reads-20261105/ci-logs/node-tests.log
          bun --bun node_modules/vitest/vitest.mjs run redux-sequence-codec.test.ts --maxWorkers=1 2>&1 | tee proofs/redux-sequence-reads-20261105/ci-logs/bun-tests.log
      - name: Verify actual workers and late optional imports
        shell: bash
        run: |
          node proofs/redux-sequence-reads-20261105/worker.mjs 2>&1 | tee proofs/redux-sequence-reads-20261105/ci-logs/workers.log
          node proofs/redux-sequence-reads-20261105/late-import.mjs
          node proofs/redux-sequence-reads-20261105/late-import.mjs --decode
          bun proofs/redux-sequence-reads-20261105/late-import.mjs
          bun proofs/redux-sequence-reads-20261105/late-import.mjs --decode
          bun proofs/redux-sequence-reads-20261105/late-import.mjs --source
          bun proofs/redux-sequence-reads-20261105/late-import.mjs --source --decode
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Verify Chromium page and worker behavior
        shell: bash
        run: node proofs/redux-sequence-reads-20261105/browser-check.mjs . sequence 2>&1 | tee proofs/redux-sequence-reads-20261105/ci-logs/chromium.log
      - name: Independently verify saved evidence without rerunning timings
        shell: bash
        run: |
          python3 proofs/redux-sequence-reads-20261105/verify.py \
            proofs/redux-sequence-reads-20261105/results/pilot.json.gz \
            proofs/redux-sequence-reads-20261105/results/formal.json.gz \
            proofs/redux-sequence-reads-20261105/results/aa.json.gz \
            proofs/redux-sequence-reads-20261105/results/aa-fallback.json.gz \
            proofs/redux-sequence-reads-20261105/results/boundary.json.gz \
            proofs/redux-sequence-reads-20261105/results/boundary-aa.json.gz \
            2>&1 | tee proofs/redux-sequence-reads-20261105/ci-logs/evidence.log
      - name: Retain correctness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redux-sequence-read-verification-${{ github.sha }}
          path: proofs/redux-sequence-reads-20261105/ci-logs/
          retention-days: 14
          if-no-files-found: warn
