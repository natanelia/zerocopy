name: Checkpoint registry correctness v2

on:
  push:
    branches: [proof/checkpoint-registry-correctness-v2-20261016]

permissions:
  contents: read

jobs:
  correctness:
    if: github.ref == 'refs/heads/proof/checkpoint-registry-correctness-v2-20261016' && github.event.before == 'afdffdcfcbd61013f120de82411c0c4a6b2d1e0e'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify workflow context placement
        run: python3 -B proofs/checkpoint-registry-correctness-v2/workflow_guard.py .github/workflows/checkpoint-registry-correctness-v2.yml
      - name: Run bounded matched correctness checks
        env:
          CI: '1'
          NO_COLOR: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          export BASELINE_DIRECTORY="$RUNNER_TEMP/checkpoint-registry-correctness-v2-baseline"
          export EVIDENCE_DIRECTORY="$RUNNER_TEMP/checkpoint-registry-correctness-v2-evidence"
          export WORK_DIRECTORY="$RUNNER_TEMP/checkpoint-registry-correctness-v2-work"
          python3 -B proofs/checkpoint-registry-correctness-v2/run.py "$GITHUB_WORKSPACE" "$BASELINE_DIRECTORY" "$EVIDENCE_DIRECTORY" "$WORK_DIRECTORY"
      - name: Locate evidence
        if: always()
        run: |
          echo "CHECKPOINT_EVIDENCE=$RUNNER_TEMP/checkpoint-registry-correctness-v2-evidence" >> "$GITHUB_ENV"
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-registry-correctness-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CHECKPOINT_EVIDENCE }}/
            proofs/checkpoint-registry-correctness-v2/*.py
            proofs/checkpoint-registry-correctness-v2/*.json
            proofs/checkpoint-registry-correctness-v2/*.md
            proofs/checkpoint-registry-correctness-v2/dependencies/package*.json
            redux-checkpoint.ts
            checkpoint-descriptor-validation.test.ts
            .github/workflows/checkpoint-registry-correctness-v2.yml
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
