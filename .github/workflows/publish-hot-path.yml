name: Publish verified hot paths

on:
  push:
    branches: [agent/immutable-performance-proof]
    paths: ['.github/patches/hot-path-*.patchpart', '.github/workflows/publish-hot-path.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify and apply the exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/hot-path-*.patchpart > /tmp/hot-path.patch
          echo '774a56e0e81e6fb9024522ce7f9230d7ccff4e7ccccb14a3bb41cc59c8b3a778  /tmp/hot-path.patch' | sha256sum --check
          git apply --check --index --unidiff-zero /tmp/hot-path.patch
          git apply --index --unidiff-zero /tmp/hot-path.patch
      - run: bun install
      - run: bun run build:wasm && bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run typecheck:redux
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bash proofs/run-hot-path-evidence.sh
      - name: Publish validated source without overwriting concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/patches/hot-path-*.patchpart .github/workflows/publish-hot-path.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: optimize immutable hot paths and add three-library memory evidence'
          git push origin HEAD:refs/heads/agent/immutable-performance-proof
          git rev-parse HEAD > proofs/results/hot-path/published-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-path-library-evidence
          path: |
            proofs/results/hot-path/
            proofs/results/cold-build/
          retention-days: 90
