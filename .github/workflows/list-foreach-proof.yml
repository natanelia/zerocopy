name: List forEach primitive performance proof

on:
  push:
    branches: [perf/list-foreach-fastpath-20261109]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install and build the tested candidate
        run: |
          bun install
          bun run build:wasm
          bun run build:browser
          bun run build:types
          bun run typecheck
      - name: Run complete Bun regression suite
        run: bun run test 2>&1 | tee /tmp/list-foreach-unit.log
      - name: Check installed package and Node queries
        run: |
          bun run check:package
          node --test proofs/list-query.mjs proofs/list-query-regression.mjs
      - name: Build the pinned baseline with identical dependencies
        env:
          BASELINE: a4265a0608ec25eec5719496225212db6b251989
        run: |
          git worktree add --detach "$RUNNER_TEMP/zerocopy-baseline" "$BASELINE"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/zerocopy-baseline/node_modules"
          (cd "$RUNNER_TEMP/zerocopy-baseline" && bun run build:wasm && bun run build:browser)
      - name: Paired fresh-process Node/Bun benchmarks
        run: |
          node proofs/list-foreach-fastpath-20261109/compare.mjs "$RUNNER_TEMP/zerocopy-baseline" "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/list-foreach-benchmark.log
      - name: Retain raw before-and-after and verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: list-foreach-proof-${{ github.sha }}
          path: |
            proofs/list-foreach-fastpath-20261109/results.json
            /tmp/list-foreach-unit.log
            /tmp/list-foreach-benchmark.log
          retention-days: 7
          if-no-files-found: warn
