name: Empty-prefix remaining correctness

on:
  push:
    branches: [proof/empty-prefix-correctness-finish-20261015]

permissions:
  contents: read

concurrency:
  group: empty-prefix-correctness-finish-20261015
  cancel-in-progress: false

jobs:
  correctness:
    if: github.repository == 'natanelia/zerocopy' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read the exact reviewed proof commit
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          fetch-tags: false
          persist-credentials: false
      - name: Install the pinned official Node release
        timeout-minutes: 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          check-latest: false
      - name: Run the fixed ordinary correctness continuation
        timeout-minutes: 26
        env:
          EMPTY_PREFIX_GATE_ROOT: ${{ runner.temp }}/empty-prefix-correctness-finish-20261015
        run: python3 proofs/empty-prefix-correctness-finish/run-hosted.py "$EMPTY_PREFIX_GATE_ROOT"
      - name: Preserve successful and negative evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: empty-prefix-correctness-finish-${{ github.sha }}
          path: ${{ runner.temp }}/empty-prefix-correctness-finish-20261015/artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
