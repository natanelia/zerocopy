name: Primitive sequence scan comparison

on:
  pull_request:
    paths:
      - 'shared-list.ts'
      - 'shared-linked-list.ts'
      - 'shared-doubly-linked-list.ts'
      - 'primitive-sequence-scan.test.ts'
      - 'proofs/primitive-scan-performance.mjs'
      - '.github/workflows/primitive-sequence-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Build and check candidate
        run: |
          bun run build:wasm
          bun run typecheck
          bun run test
      - name: Check out base source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .primitive-baseline
      - name: Build base Wasm
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" .primitive-baseline/node_modules
          (cd .primitive-baseline && bun run build:wasm)
      - name: Interleaved baseline / candidate benchmark with value checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'main' }}
        run: bun proofs/primitive-scan-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primitive-scan-performance-evidence
          path: proofs/results/primitive-scan-comparison.json
          retention-days: 30
