name: Shared session lazy kernel candidate screen (proof only)
on:
  push:
    branches: [proof/shared-session-shard-publication-20261126]
    paths: ['.github/workflows/shared-session-shards-proof.yml', 'arena.ts', 'proofs/shared-session-shards-20261126.mjs', 'worker-attachment.test.ts']
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
      - name: Build pinned baseline and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 50b06167909ff1398d293948c4a82c5f7bea5863 HEAD -- . ':(exclude).github/workflows/shared-session-shards-proof.yml' ':(exclude)proofs/shared-session-shards-20261126.mjs' ':(exclude)proofs/shared-session-shards-20261126.md' ':(exclude)arena.ts' ':(exclude)worker-attachment.test.ts'
          mkdir -p shared-session-shards-results
          git worktree add --detach "$RUNNER_TEMP/baseline" 50b06167909ff1398d293948c4a82c5f7bea5863
          cp proofs/shared-session-shards-20261126.mjs "$RUNNER_TEMP/baseline/proofs/"
          node --version
          bun --version
          (cd "$RUNNER_TEMP/baseline" && bun install --frozen-lockfile && bun run build:wasm && bun run build:browser)
          bun install --frozen-lockfile
          bun run build:wasm && bun run build:browser && bun run build:types
      - name: Run correctness and compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          # Match the normal CI runner: bunx vitest uses Node, which cannot resolve
          # the existing extensionless TS imports inside eval workers.
          (cd "$RUNNER_TEMP/baseline" && bun run test workers.test.ts) 2>&1 | tee shared-session-shards-results/baseline-worker-tests.log
          bun run test worker-attachment.test.ts worker.test.ts workers.test.ts object-read-cache.test.ts primitive-scan-portability.test.ts 2>&1 | tee shared-session-shards-results/candidate-tests.log
          node proofs/worker-sessions.mjs 2>&1 | tee shared-session-shards-results/node-session-proof.log
      - name: Pair actual worker publications with identical-build controls
        shell: bash
        run: |
          set -euo pipefail
          node proofs/shared-session-shards-20261126.mjs shared-session-shards-results "$RUNNER_TEMP/baseline" | tee shared-session-shards-results/run.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shared-session-shards-${{ github.run_id }}-${{ github.run_attempt }}
          path: shared-session-shards-results/
          retention-days: 14
          if-no-files-found: warn
