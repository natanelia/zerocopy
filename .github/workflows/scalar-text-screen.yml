name: Bounded scalar text screen
on:
  push:
    branches: [proof/scalar-text-screen-20261009]
permissions:
  contents: read
concurrency:
  group: bounded-scalar-text-screen
  cancel-in-progress: false
jobs:
  screen:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'natanelia/zerocopy' &&
      github.ref == 'refs/heads/proof/scalar-text-screen-20261009' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == 1 &&
      github.event.before == '3efaa3bb110f1d4e979d279aec12f52e2b37731b'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify immutable activation, run fresh gates and the single bounded screen
        run: bash proofs/scalar-text-screen-ci.sh
      - name: Retain exact tested source and activation
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/scalar-text-screen"
          git archive HEAD > "$RUNNER_TEMP/scalar-text-screen/tested-source.tar"
          if test -f "$RUNNER_TEMP/scalar-text-screen-activation.json"; then
            cp "$RUNNER_TEMP/scalar-text-screen-activation.json" "$RUNNER_TEMP/scalar-text-screen/activation.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-text-screen-${{ github.sha }}
          path: ${{ runner.temp }}/scalar-text-screen/
          retention-days: 14
          if-no-files-found: error
