name: Redux integration

on:
  # Main-branch PRs get these suites and proofs from CI. Preserve the legacy
  # branch target, which does not run that workflow, plus manual diagnostics.
  pull_request:
    branches: [agent/immutable-performance-proof]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only superseded PR revisions cancel each other; keep standalone evidence runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  redux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm
      - run: bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run typecheck:redux
      - name: Complete unit and Redux integration suite
        run: bun run test
      - name: Packaged Node entrypoints
        run: bun run proof:redux
      - name: Existing real Node worker proof
        run: bun run proof:node
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Real Chromium browser suite
        run: bun run test:browser
      - name: Check published file contents
        run: npm pack --dry-run
