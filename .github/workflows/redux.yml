name: Redux integration

on:
  pull_request:
    branches: [main, agent/immutable-performance-proof]

permissions:
  contents: read

concurrency:
  group: redux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build:wasm
      - run: bun run build:browser && bun run build:types
      - run: bun run typecheck && bun run typecheck:redux
      - name: Complete unit and Redux integration suite
        run: bun run test
      - name: Packaged Node entrypoints
        run: bun run proof:redux
      - name: Existing real Node worker proof
        run: bun run proof:node
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Real Chromium browser suite
        run: bun run test:browser
      - name: Check published file contents
        run: npm pack --dry-run
