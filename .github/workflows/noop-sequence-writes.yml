name: Vector-only no-op sequence write diagnostics

on:
  workflow_dispatch:
  push:
    branches: ['perf/noop-sequence-writes-*']

permissions:
  contents: read

concurrency:
  group: noop-sequence-writes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    if: startsWith(github.ref, 'refs/heads/perf/noop-sequence-writes-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Prepare exact baseline and shared dependencies
        run: |
          bun install
          git worktree add --detach "$RUNNER_TEMP/noop-sequence-baseline" 3773c6e519c7c0958da13727ed1082f449f3ee25
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/noop-sequence-baseline/node_modules"
      - name: Build each WASM core and portable bundle with recorded matching compilers
        run: node proofs/noop-sequence-build.mjs "$RUNNER_TEMP/noop-sequence-baseline" . proofs/results/noop-sequence/build.json
      - name: Check declarations, all type configurations and installed tarball
        run: |
          bun run build:types
          bun run typecheck
          bun run typecheck:redux
          bun run typecheck:values
          bun run typecheck:geometry
          bun run check:package
      - name: Run full unit suite and standalone proof tests
        run: |
          bun --bun node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism --testTimeout=30000
          node --test proofs/noop-sequence-tests.node.mjs
      - name: Verify actual package allocation invariants and shared/copy workers
        run: |
          node proofs/noop-sequence-invariants.mjs "$RUNNER_TEMP/noop-sequence-baseline/dist/shared.js" baseline > proofs/results/noop-sequence/baseline-node-invariants.json
          node proofs/noop-sequence-invariants.mjs dist/shared.js vector-only > proofs/results/noop-sequence/candidate-node-invariants.json
          bun proofs/noop-sequence-invariants.mjs "$RUNNER_TEMP/noop-sequence-baseline/dist/shared.js" baseline > proofs/results/noop-sequence/baseline-bun-invariants.json
          bun proofs/noop-sequence-invariants.mjs dist/shared.js vector-only > proofs/results/noop-sequence/candidate-bun-invariants.json
          node proofs/noop-sequence-worker.mjs "$RUNNER_TEMP/noop-sequence-baseline/dist/shared.js" baseline > proofs/results/noop-sequence/baseline-workers.json
          node proofs/noop-sequence-worker.mjs dist/shared.js vector-only > proofs/results/noop-sequence/candidate-workers.json
      - name: Run fixed Node x64 A/A and A/B quartets
        run: node proofs/noop-sequence-performance.mjs "$RUNNER_TEMP/noop-sequence-baseline/dist/shared.js" dist/shared.js proofs/results/noop-sequence/node.json proofs/results/noop-sequence/build.json
      - name: Run fixed Bun x64 A/A and A/B quartets
        run: bun proofs/noop-sequence-performance.mjs "$RUNNER_TEMP/noop-sequence-baseline/dist/shared.js" dist/shared.js proofs/results/noop-sequence/bun.json proofs/results/noop-sequence/build.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noop-sequence-x64-${{ github.sha }}
          path: proofs/results/noop-sequence/
          retention-days: 30
          if-no-files-found: error
